<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MOSW Text Overlay</title>
  <style>
    html, body { margin: 0; width: 100%; min-height: 100%; background: #101010; color: #fff; font-family: system-ui, sans-serif; overscroll-behavior: none; }
    body { box-sizing: border-box; padding: 18px 12px 32px; }
    #app { width: 100%; max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 14px; font-size: 18px; letter-spacing: .08em; }
    .tabs, .buttonRow, .grid, .presetGrid { display: grid; gap: 8px; }
    .tabs { grid-template-columns: repeat(3, 1fr); margin-bottom: 12px; }
    .tabBtn, button, select, input, textarea { font: inherit; }
    button, .tabBtn { min-height: 42px; border: 1px solid rgba(255,255,255,.2); border-radius: 11px; background: #262626; color: #fff; cursor: pointer; }
    button.active, .tabBtn.active { background: #00d084; color: #04100b; font-weight: 800; }
    textarea { width: 100%; min-height: 132px; resize: vertical; box-sizing: border-box; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 12px; background: #181818; color: #fff; line-height: 1.45; }
    details { margin-top: 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: #151515; overflow: hidden; }
    summary { padding: 13px 14px; cursor: pointer; color: rgba(255,255,255,.86); font-weight: 800; letter-spacing: .06em; }
    .panel { padding: 0 14px 14px; }
    label { display: grid; gap: 6px; color: rgba(255,255,255,.74); font-size: 13px; }
    input, select { min-height: 38px; box-sizing: border-box; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 7px 9px; background: #202020; color: #fff; }
    input[type="range"] { padding: 0; }
    input[type="color"] { padding: 2px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 10px; }
    .presetGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 10px 0 12px; }
    .buttonRow { grid-template-columns: repeat(3, 1fr); margin: 12px 0; }
    .toggleGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .toggleGrid label { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 6px 8px; border-radius: 10px; background: #202020; }
    #status { min-height: 22px; margin-top: 10px; color: #00e676; text-align: center; font-size: 13px; }
    @media (max-width: 520px) { .grid, .presetGrid, .buttonRow { grid-template-columns: 1fr; } .toggleGrid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app">
    <h1>TEXT OVERLAY</h1>
    <div class="tabs"><button class="tabBtn active" data-layer="layer1">Layer 1</button><button class="tabBtn" data-layer="layer2">Layer 2</button><button class="tabBtn" data-layer="layer3">Layer 3</button></div>
    <textarea id="textInput" placeholder="表示する文字を入力"></textarea>
    <div class="presetGrid" id="presetButtons"></div>
    <div class="buttonRow"><button id="showBtn">表示</button><button id="pauseBtn">一時停止</button><button id="resumeBtn">再開</button><button id="hideBtn">非表示</button><button id="clearBtn">消去</button><button id="resetBtn">初期化</button></div>
    <details open><summary>文字</summary><div class="panel grid"><label>フォント<select id="fontFamily"></select></label><label>文字揃え<select id="textAlign"><option value="left">左揃え</option><option value="center">中央揃え</option><option value="right">右揃え</option></select></label><label>サイズ<input id="fontSize" type="range" min="20" max="300" step="1"></label><label>サイズ px<input id="fontSizeNumber" type="number" min="20" max="300" step="1"></label><label>文字色<input id="color" type="color"></label><label>HEX<input id="colorHex" type="text"></label><label>透明度 %<input id="opacity" type="range" min="0" max="100" step="1"></label><label>重なり順<input id="zIndex" type="number" min="1" max="99" step="1"></label></div><div class="panel toggleGrid"><label><input id="bold" type="checkbox">太字</label><label><input id="italic" type="checkbox">斜体</label><label><input id="underline" type="checkbox">下線</label></div></details>
    <details><summary>装飾</summary><div class="panel toggleGrid"><label><input id="strokeEnabled" type="checkbox">縁取り</label><label><input id="shadowEnabled" type="checkbox">ドロップシャドウ</label><label><input id="backgroundEnabled" type="checkbox">背景帯</label></div><div class="panel grid"><label>縁取り色<input id="strokeColor" type="color"></label><label>縁取り幅<input id="strokeWidth" type="range" min="0" max="20" step="1"></label><label>影色<input id="shadowColor" type="color"></label><label>影ぼかし<input id="shadowBlur" type="range" min="0" max="60" step="1"></label><label>影X<input id="shadowOffsetX" type="number" min="-80" max="80" step="1"></label><label>影Y<input id="shadowOffsetY" type="number" min="-80" max="80" step="1"></label><label>背景色<input id="backgroundColor" type="color"></label><label>背景透明度 %<input id="backgroundOpacity" type="range" min="0" max="100" step="1"></label><label>背景余白<input id="backgroundPadding" type="range" min="0" max="80" step="1"></label><label>背景角丸<input id="backgroundRadius" type="range" min="0" max="80" step="1"></label></div></details>
    <details><summary>位置</summary><div class="panel grid"><label>基準位置<select id="positionPreset"></select></label><label>X %<input id="xPercent" type="range" min="0" max="100" step="1"></label><label>X 数値<input id="xPercentNumber" type="number" min="0" max="100" step="1"></label><label>Y %<input id="yPercent" type="range" min="0" max="100" step="1"></label><label>Y 数値<input id="yPercentNumber" type="number" min="0" max="100" step="1"></label><label>上余白<input id="marginTop" type="number" min="0" max="400" step="1"></label><label>下余白<input id="marginBottom" type="number" min="0" max="400" step="1"></label><label>左余白<input id="marginLeft" type="number" min="0" max="400" step="1"></label><label>右余白<input id="marginRight" type="number" min="0" max="400" step="1"></label></div></details>
    <details><summary>移動</summary><div class="panel grid"><label>移動モード<select id="direction"><option value="fixed">固定</option><option value="left">右から左</option><option value="right">左から右</option><option value="down">上から下</option><option value="up">下から上</option></select></label><label>ループ<select id="loopMode"><option value="loop">ループする</option><option value="once">1回だけ再生</option><option value="bounce">画面端で反転</option></select></label><label>速度<input id="speed" type="range" min="0" max="20" step="0.1"></label><label>速度 数値<input id="speedNumber" type="number" min="0" max="20" step="0.1"></label></div></details>
    <details><summary>アニメーション</summary><div class="panel toggleGrid"><label><input id="blink" type="checkbox">点滅</label><label><input id="fade" type="checkbox">フェード</label><label><input id="pulse" type="checkbox">拡大縮小</label><label><input id="shakeX" type="checkbox">左右の揺れ</label><label><input id="shakeY" type="checkbox">上下の揺れ</label><label><input id="rotate" type="checkbox">回転</label><label><input id="glitch" type="checkbox">グリッチ</label><label><input id="rainbow" type="checkbox">色変化</label></div><div class="panel grid"><label>速度<input id="animationSpeed" type="range" min="0" max="10" step="0.1"></label><label>強度<input id="animationIntensity" type="range" min="0" max="10" step="0.1"></label></div></details>
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onChildAdded, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyAaqSeyjtG7Y0CbhAITOjjP5lvAAbk2-k", authDomain: "mosw-f855e.firebaseapp.com", databaseURL: "https://mosw-f855e-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "mosw-f855e", storageBucket: "mosw-f855e.firebasestorage.app", messagingSenderId: "1093592474312", appId: "1:1093592474312:web:76370050415013cf9bbbfd" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app); const reactionsRef = ref(db, "reactions");
    const LAYER_IDS = ["layer1", "layer2", "layer3"];
    const fonts = ["sans-serif", "serif", "monospace", "Arial", "Helvetica", "Impact", "Georgia", "Times New Roman", "system-ui"];
    const presets = [{ label: "EVENT TITLE", text: "EVENT TITLE" }, { label: "DJ NAME", text: "DJ NAME" }, { label: "NOW PLAYING", text: "NOW PLAYING" }, { label: "NEXT DJ", text: "NEXT DJ" }, { label: "TIMETABLE", text: "20:00 OPEN\n20:30 DJ A\n21:30 DJ B\n22:30 LIVE" }, { label: "THANK YOU", text: "THANK YOU" }, { label: "自由入力", text: "" }];
    const positionPresets = [["top-left", "左上"], ["top-center", "上中央"], ["top-right", "右上"], ["middle-left", "左中央"], ["center", "中央"], ["middle-right", "右中央"], ["bottom-left", "左下"], ["bottom-center", "下中央"], ["bottom-right", "右下"], ["custom", "自由位置"]];
    const ids = ["textInput", "fontFamily", "fontSize", "fontSizeNumber", "color", "colorHex", "opacity", "textAlign", "zIndex", "bold", "italic", "underline", "strokeEnabled", "strokeColor", "strokeWidth", "shadowEnabled", "shadowColor", "shadowBlur", "shadowOffsetX", "shadowOffsetY", "backgroundEnabled", "backgroundColor", "backgroundOpacity", "backgroundPadding", "backgroundRadius", "positionPreset", "xPercent", "xPercentNumber", "yPercent", "yPercentNumber", "marginTop", "marginBottom", "marginLeft", "marginRight", "direction", "loopMode", "speed", "speedNumber", "blink", "fade", "pulse", "shakeX", "shakeY", "rotate", "glitch", "rainbow", "animationSpeed", "animationIntensity"];
    const els = {}; ids.forEach(id => els[id] = document.getElementById(id));
    const status = document.getElementById("status"); let currentLayerId = "layer1"; let layers = {}; let applyingRemote = false; let saveTimer = null;
    function defaultLayer(index = 1) { return { text: "", visible: false, playing: true, fontFamily: "Impact, system-ui, sans-serif", fontSize: 100, fontWeight: "bold", fontStyle: "normal", textDecoration: "none", color: "#ffffff", opacity: 1, textAlign: "center", positionPreset: index === 1 ? "top-center" : index === 2 ? "center" : "bottom-center", xPercent: 50, yPercent: index === 1 ? 12 : index === 2 ? 50 : 82, marginTop: 24, marginBottom: 24, marginLeft: 24, marginRight: 24, direction: "fixed", speed: 5, loopMode: "loop", strokeEnabled: true, strokeColor: "#000000", strokeWidth: 5, shadowEnabled: true, shadowColor: "#000000", shadowBlur: 10, shadowOffsetX: 4, shadowOffsetY: 4, backgroundEnabled: false, backgroundColor: "#000000", backgroundOpacity: 0.5, backgroundPadding: 20, backgroundRadius: 10, animations: { blink: false, fade: false, pulse: false, shakeX: false, shakeY: false, rotate: false, glitch: false, rainbow: false }, animationSpeed: 1, animationIntensity: 1, zIndex: index, resetToken: 0, updatedAt: 0 }; }
    function sanitizeLayer(layer, index) { return { ...defaultLayer(index), ...(layer || {}), animations: { ...defaultLayer(index).animations, ...((layer || {}).animations || {}) } }; }
    fonts.forEach(font => { const option = document.createElement("option"); option.value = font.includes(" ") ? '"' + font + '", serif' : font + ", sans-serif"; option.textContent = font; els.fontFamily.appendChild(option); });
    positionPresets.forEach(([value, label]) => { const option = document.createElement("option"); option.value = value; option.textContent = label; els.positionPreset.appendChild(option); });
    presets.forEach(preset => { const btn = document.createElement("button"); btn.type = "button"; btn.textContent = preset.label; btn.onclick = () => updateCurrentLayer({ text: preset.text, resetToken: Date.now() }); document.getElementById("presetButtons").appendChild(btn); });
    function currentLayer() { return sanitizeLayer(layers[currentLayerId], LAYER_IDS.indexOf(currentLayerId) + 1); }
    function setVal(id, value) { if (els[id]) els[id].value = value; } function setChecked(id, value) { if (els[id]) els[id].checked = !!value; }
    function applyLayerToUI() { applyingRemote = true; const layer = currentLayer(); setVal("textInput", layer.text); setVal("fontFamily", layer.fontFamily); setVal("fontSize", layer.fontSize); setVal("fontSizeNumber", layer.fontSize); setVal("color", layer.color); setVal("colorHex", layer.color); setVal("opacity", Math.round(layer.opacity * 100)); setVal("textAlign", layer.textAlign); setVal("zIndex", layer.zIndex); setChecked("bold", layer.fontWeight === "bold"); setChecked("italic", layer.fontStyle === "italic"); setChecked("underline", layer.textDecoration === "underline"); setChecked("strokeEnabled", layer.strokeEnabled); setVal("strokeColor", layer.strokeColor); setVal("strokeWidth", layer.strokeWidth); setChecked("shadowEnabled", layer.shadowEnabled); setVal("shadowColor", layer.shadowColor); setVal("shadowBlur", layer.shadowBlur); setVal("shadowOffsetX", layer.shadowOffsetX); setVal("shadowOffsetY", layer.shadowOffsetY); setChecked("backgroundEnabled", layer.backgroundEnabled); setVal("backgroundColor", layer.backgroundColor); setVal("backgroundOpacity", Math.round(layer.backgroundOpacity * 100)); setVal("backgroundPadding", layer.backgroundPadding); setVal("backgroundRadius", layer.backgroundRadius); setVal("positionPreset", layer.positionPreset); setVal("xPercent", layer.xPercent); setVal("xPercentNumber", layer.xPercent); setVal("yPercent", layer.yPercent); setVal("yPercentNumber", layer.yPercent); setVal("marginTop", layer.marginTop); setVal("marginBottom", layer.marginBottom); setVal("marginLeft", layer.marginLeft); setVal("marginRight", layer.marginRight); setVal("direction", layer.direction); setVal("loopMode", layer.loopMode); setVal("speed", layer.speed); setVal("speedNumber", layer.speed); ["blink", "fade", "pulse", "shakeX", "shakeY", "rotate", "glitch", "rainbow"].forEach(key => setChecked(key, layer.animations[key])); setVal("animationSpeed", layer.animationSpeed); setVal("animationIntensity", layer.animationIntensity); document.querySelectorAll(".tabBtn").forEach(btn => btn.classList.toggle("active", btn.dataset.layer === currentLayerId)); applyingRemote = false; }
    function getUIValues() { const base = currentLayer(); return { ...base, text: els.textInput.value, fontFamily: els.fontFamily.value, fontSize: Number(els.fontSize.value), fontWeight: els.bold.checked ? "bold" : "normal", fontStyle: els.italic.checked ? "italic" : "normal", textDecoration: els.underline.checked ? "underline" : "none", color: els.colorHex.value || els.color.value, opacity: Number(els.opacity.value) / 100, textAlign: els.textAlign.value, zIndex: Number(els.zIndex.value), strokeEnabled: els.strokeEnabled.checked, strokeColor: els.strokeColor.value, strokeWidth: Number(els.strokeWidth.value), shadowEnabled: els.shadowEnabled.checked, shadowColor: els.shadowColor.value, shadowBlur: Number(els.shadowBlur.value), shadowOffsetX: Number(els.shadowOffsetX.value), shadowOffsetY: Number(els.shadowOffsetY.value), backgroundEnabled: els.backgroundEnabled.checked, backgroundColor: els.backgroundColor.value, backgroundOpacity: Number(els.backgroundOpacity.value) / 100, backgroundPadding: Number(els.backgroundPadding.value), backgroundRadius: Number(els.backgroundRadius.value), positionPreset: els.positionPreset.value, xPercent: Number(els.xPercent.value), yPercent: Number(els.yPercent.value), marginTop: Number(els.marginTop.value), marginBottom: Number(els.marginBottom.value), marginLeft: Number(els.marginLeft.value), marginRight: Number(els.marginRight.value), direction: els.direction.value, loopMode: els.loopMode.value, speed: Number(els.speed.value), animations: { blink: els.blink.checked, fade: els.fade.checked, pulse: els.pulse.checked, shakeX: els.shakeX.checked, shakeY: els.shakeY.checked, rotate: els.rotate.checked, glitch: els.glitch.checked, rainbow: els.rainbow.checked }, animationSpeed: Number(els.animationSpeed.value), animationIntensity: Number(els.animationIntensity.value), updatedAt: Date.now() }; }
    function updateCurrentLayer(patch, immediate = false) { layers[currentLayerId] = { ...currentLayer(), ...patch }; applyLayerToUI(); scheduleSave(immediate); }
    function scheduleSave(immediate = false) { if (applyingRemote) return; clearTimeout(saveTimer); saveTimer = setTimeout(saveAllLayers, immediate ? 0 : 180); }
    async function saveAllLayers() { try { const merged = { ...layers, [currentLayerId]: getUIValues() }; LAYER_IDS.forEach((id, index) => merged[id] = sanitizeLayer(merged[id], index + 1)); await push(reactionsRef, { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), type: "textOverlay", layers: merged, timestamp: serverTimestamp() }); status.textContent = "SYNCED"; setTimeout(() => status.textContent = "", 700); } catch (error) { status.textContent = "保存エラー: " + error.message; } }
    function syncPair(a, b) { els[a].addEventListener("input", () => { els[b].value = els[a].value; scheduleSave(); }); els[b].addEventListener("input", () => { els[a].value = els[b].value; scheduleSave(); }); }
    Object.values(els).forEach(el => { const eventName = el.tagName === "SELECT" || el.type === "checkbox" || el.type === "color" ? "change" : "input"; el.addEventListener(eventName, () => { if (!applyingRemote) scheduleSave(); }); });
    syncPair("fontSize", "fontSizeNumber"); syncPair("xPercent", "xPercentNumber"); syncPair("yPercent", "yPercentNumber"); syncPair("speed", "speedNumber");
    els.color.oninput = () => { els.colorHex.value = els.color.value; scheduleSave(); }; els.colorHex.oninput = () => { if (/^#[0-9a-fA-F]{6}$/.test(els.colorHex.value)) els.color.value = els.colorHex.value; scheduleSave(); };
    document.querySelectorAll(".tabBtn").forEach(btn => btn.onclick = () => { layers[currentLayerId] = getUIValues(); currentLayerId = btn.dataset.layer; applyLayerToUI(); });
    document.getElementById("showBtn").onclick = () => updateCurrentLayer({ visible: true, playing: true, resetToken: Date.now() }, true); document.getElementById("pauseBtn").onclick = () => updateCurrentLayer({ playing: false }, true); document.getElementById("resumeBtn").onclick = () => updateCurrentLayer({ playing: true }, true); document.getElementById("hideBtn").onclick = () => updateCurrentLayer({ visible: false }, true); document.getElementById("clearBtn").onclick = () => updateCurrentLayer({ text: "", visible: false, resetToken: Date.now() }, true); document.getElementById("resetBtn").onclick = () => { layers[currentLayerId] = { ...defaultLayer(LAYER_IDS.indexOf(currentLayerId) + 1), resetToken: Date.now(), updatedAt: Date.now() }; applyLayerToUI(); scheduleSave(true); };
    onChildAdded(reactionsRef, snapshot => { const data = snapshot.val(); if (!data || data.type !== "textOverlay" || !data.layers) return; LAYER_IDS.forEach((id, index) => layers[id] = sanitizeLayer(data.layers[id], index + 1)); applyLayerToUI(); });
  </script>
</body>
</html>
