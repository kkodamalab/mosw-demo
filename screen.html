          { video: videoB, id: "B", rect: { x: 0, y: 0, w, h } }
        ];
      }

      if (camMode === "pip") {
        const pw = w * 0.3;
        const ph = pw * 9 / 16;
        const m = 28;
        return [
          { video: videoA, id: "A", rect: { x: 0, y: 0, w, h } },
          { video: videoB, id: "B", rect: { x: w - pw - m, y: h - ph - m, w: pw, h: ph } }
        ];
      }

      return [];
    }

    function averageLandmarks(points) {
      const sum = points.reduce((acc, point) => {
        acc.x += point.x;
        acc.y += point.y;
        return acc;
      }, { x: 0, y: 0 });
      return {
        x: sum.x / points.length,
        y: sum.y / points.length
      };
    }

    function smoothAngle(prev, next, amount) {
      if (prev == null) return next;
      let delta = next - prev;
      while (delta > Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      return prev + delta * amount;
    }

    function mapVideoPointToCanvas(normalizedX, normalizedY, video, rect) {
      if (!video || !video.videoWidth || !video.videoHeight) {
        return {
          x: rect.x + normalizedX * rect.w,
          y: rect.y + normalizedY * rect.h
        };
      }

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.max(rect.w / vw, rect.h / vh);
      const sw = rect.w / scale;
      const sh = rect.h / scale;
      const sx = (vw - sw) / 2;
      const sy = (vh - sh) / 2;

      return {
        x: rect.x + ((normalizedX * vw - sx) / sw) * rect.w,
        y: rect.y + ((normalizedY * vh - sy) / sh) * rect.h
      };
    }

    function detectFacesForFeed(feed) {
      if (!feed.video.videoWidth || !faceLandmarker) return null;

      const currentTime = feed.video.currentTime;
      if (feed.id === "A" && lastFaceVideoTimeA === currentTime) return faceResultsA;
      if (feed.id === "B" && lastFaceVideoTimeB === currentTime) return faceResultsB;
      if (frame % 3 !== 0) return feed.id === "A" ? faceResultsA : faceResultsB;

      const result = faceLandmarker.detectForVideo(feed.video, performance.now());
      if (feed.id === "A") {
        faceResultsA = result;
        lastFaceVideoTimeA = currentTime;
      } else {
        faceResultsB = result;
        lastFaceVideoTimeB = currentTime;
      }
      return result;
    }

    function mapFaceDetectionToCanvas(face, feed) {
      if (!face || !feed) return null;
      if (!face[10] || !face[152] || !face[33] || !face[133] || !face[362] || !face[263]) return null;

      const leftEye = averageLandmarks([face[33], face[133]]);
      const rightEye = averageLandmarks([face[362], face[263]]);
      const leftPoint = mapVideoPointToCanvas(leftEye.x, leftEye.y, feed.video, feed.rect);
      const rightPoint = mapVideoPointToCanvas(rightEye.x, rightEye.y, feed.video, feed.rect);
      const topPoint = mapVideoPointToCanvas(face[10].x, face[10].y, feed.video, feed.rect);
      const chinPoint = mapVideoPointToCanvas(face[152].x, face[152].y, feed.video, feed.rect);
      const sideA = face[234] ? mapVideoPointToCanvas(face[234].x, face[234].y, feed.video, feed.rect) : leftPoint;
      const sideB = face[454] ? mapVideoPointToCanvas(face[454].x, face[454].y, feed.video, feed.rect) : rightPoint;
      const eyeDist = Math.hypot(rightPoint.x - leftPoint.x, rightPoint.y - leftPoint.y);
      const faceHeight = Math.max(eyeDist * 1.45, Math.hypot(chinPoint.x - topPoint.x, chinPoint.y - topPoint.y));
      const faceWidth = Math.max(eyeDist * 2.25, Math.hypot(sideB.x - sideA.x, sideB.y - sideA.y));
      if (!Number.isFinite(faceWidth) || !Number.isFinite(faceHeight) || faceWidth <= 0 || faceHeight <= 0) return null;

      return {
        cameraId: feed.id,
        x: (sideA.x + sideB.x + topPoint.x + chinPoint.x) / 4,
        y: (sideA.y + sideB.y + topPoint.y + chinPoint.y) / 4,
        width: faceWidth,
        height: faceHeight,
        size: Math.max(faceWidth * 1.2, faceHeight * 0.82),
        angle: Math.atan2(rightPoint.y - leftPoint.y, rightPoint.x - leftPoint.x)
      };
    }

    function findNearestFaceTrack(detection, usedTrackIds) {
      let best = null;
      let bestDist = Infinity;
      for (const track of faceTracks.values()) {
        if (usedTrackIds.has(track.id) || track.cameraId !== detection.cameraId) continue;
        const distToTrack = Math.hypot(track.x - detection.x, track.y - detection.y);
        const maxDist = Math.max(80, Math.max(track.size, detection.size) * 0.75);
        if (distToTrack < maxDist && distToTrack < bestDist) {
          best = track;
          bestDist = distToTrack;
        }
      }
      return best;
    }

    function updateFaceTracks(detections, cameraId, now) {
      const usedTrackIds = new Set();
      detections.forEach(detection => {
        detection.cameraId = detection.cameraId || cameraId;
        let track = findNearestFaceTrack(detection, usedTrackIds);
        if (!track) {
          track = {
            id: nextFaceTrackId++,
            cameraId: detection.cameraId,
            x: detection.x,
            y: detection.y,
            width: detection.width,
            height: detection.height,
            size: detection.size,
            angle: detection.angle,
            lastSeen: now
          };
          faceTracks.set(track.id, track);
        } else {
          track.x += (detection.x - track.x) * FACE_TRACK_POSITION_SMOOTHING;
          track.y += (detection.y - track.y) * FACE_TRACK_POSITION_SMOOTHING;
          track.width += (detection.width - track.width) * FACE_TRACK_SIZE_SMOOTHING;
          track.height += (detection.height - track.height) * FACE_TRACK_SIZE_SMOOTHING;
          track.size += (detection.size - track.size) * FACE_TRACK_SIZE_SMOOTHING;
          track.angle = smoothAngle(track.angle, detection.angle, FACE_TRACK_ROTATION_SMOOTHING);
          track.cameraId = detection.cameraId;
          track.lastSeen = now;
        }
        usedTrackIds.add(track.id);
      });

      for (const [id, track] of faceTracks.entries()) {
        const hasMask = activeFaceMasks.some(mask => mask.trackId === id);
        if (!hasMask && now - track.lastSeen > FACE_LOST_GRACE_PERIOD * 3) faceTracks.delete(id);
      }
    }

    function collectFaceDetections(w, h) {
      const detections = [];
      getVisibleFaceFeeds(w, h).forEach(feed => {
        const result = detectFacesForFeed(feed);
        const faces = result && result.faceLandmarks ? result.faceLandmarks : [];
        faces.forEach(face => {
          const detection = mapFaceDetectionToCanvas(face, feed);
          if (detection) detections.push(detection);
        });
      });
      return detections;
    }

    function trackHasActiveFaceMask(trackId, now = performance.now()) {
      return activeFaceMasks.some(mask => mask.trackId === trackId && now < mask.endTime);
    }

    function assignQueuedMasksToFaces(now) {
      if (!faceMaskEnabled || faceMaskQueue.length === 0 || faceTracks.size === 0) return;
      const tracks = [...faceTracks.values()]
        .filter(track => now - track.lastSeen <= FACE_LOST_GRACE_PERIOD && !trackHasActiveFaceMask(track.id, now))
        .sort((a, b) => a.id - b.id);
      if (!tracks.length) return;

      let guard = tracks.length;
      while (faceMaskQueue.length && guard > 0) {
        const track = tracks[nextFaceMaskTrackIndex % tracks.length];
        nextFaceMaskTrackIndex++;
        guard--;
        if (trackHasActiveFaceMask(track.id, now)) continue;
        const item = faceMaskQueue.shift();
        activeFaceMasks.push({
          id: item.id,
          emoji: item.emoji,
          trackId: track.id,
          startTime: now,
          endTime: now + FACE_MASK_DURATION
        });
      }
    }

    function updateActiveFaceMasks(now) {
      activeFaceMasks = activeFaceMasks.filter(mask => {
        const track = faceTracks.get(mask.trackId);
        if (!faceMaskEnabled || now >= mask.endTime) return false;
        if (!track) return now < mask.startTime + FACE_LOST_GRACE_PERIOD;
        return now - track.lastSeen <= FACE_LOST_GRACE_PERIOD || now < mask.endTime - FACE_MASK_FADE_MS;
      });
    }

    function updateFaceMaskSystem(w, h, now) {
      updateFaceTracks(collectFaceDetections(w, h), "", now);
      updateActiveFaceMasks(now);
      assignQueuedMasksToFaces(now);
    }

    function drawFaceMasks(targetCtx, now) {
      if (!faceMaskEnabled) return;
      targetCtx.save();
      targetCtx.textAlign = "center";
      targetCtx.textBaseline = "middle";
      activeFaceMasks.forEach(mask => {
        const track = faceTracks.get(mask.trackId);
        if (!track) return;
        const remaining = mask.endTime - now;
        const lostMs = now - track.lastSeen;
        let alpha = remaining > FACE_MASK_FADE_MS ? 1 : Math.max(0, remaining / FACE_MASK_FADE_MS);
        if (lostMs > FACE_LOST_GRACE_PERIOD) {
          alpha *= Math.max(0, 1 - (lostMs - FACE_LOST_GRACE_PERIOD) / FACE_MASK_FADE_MS);
        }
        if (alpha <= 0) return;

        targetCtx.save();
        targetCtx.globalAlpha = alpha;
        targetCtx.translate(track.x, track.y);
        targetCtx.rotate(track.angle);
        targetCtx.font = `${Math.max(28, track.size)}px ${FACE_MASK_FONT}`;
        targetCtx.fillText(mask.emoji, 0, 0);
        targetCtx.restore();
      });

      if (DEBUG_FACE_MASK) {
        targetCtx.font = "12px sans-serif";
        targetCtx.textAlign = "left";
        targetCtx.textBaseline = "top";
        for (const track of faceTracks.values()) {
          targetCtx.strokeStyle = "rgba(0,255,180,0.9)";
          targetCtx.lineWidth = 2;
          targetCtx.strokeRect(track.x - track.width / 2, track.y - track.height / 2, track.width, track.height);
          targetCtx.fillStyle = "rgba(0,255,180,0.9)";
          targetCtx.fillRect(track.x - 2, track.y - 2, 4, 4);
          const mask = activeFaceMasks.find(item => item.trackId === track.id);
          targetCtx.fillText(`#${track.id} ${mask ? mask.emoji : ""}`, track.x + 8, track.y + 8);
        }
        targetCtx.fillText(`queue:${faceMaskQueue.length}`, 12, 12);
      }
      targetCtx.restore();
    }

    function enqueueFaceMaskReaction(data, fallbackId = "") {
      if (!faceMaskEnabled || !data) return;
      const emoji = typeof data.value === "string" ? data.value : typeof data.emoji === "string" ? data.emoji : "";
      if (!faceMaskEmojis.includes(emoji)) return;
      const timestamp = typeof data.timestamp === "number" ? data.timestamp : Date.now();
      if (timestamp < faceMaskBootTime - 5000) return;
      const id = String(data.id || fallbackId || `${timestamp}:${emoji}`);
      if (processedFaceMaskIds.has(id)) return;
      processedFaceMaskIds.add(id);
      if (processedFaceMaskIds.size > 300) {
        const first = processedFaceMaskIds.values().next().value;
        processedFaceMaskIds.delete(first);
      }
      faceMaskQueue.push({ id, emoji, timestamp });
      while (faceMaskQueue.length > MAX_FACE_MASK_QUEUE) faceMaskQueue.shift();
    }

    // ========================================
    // HAND GESTURE EMOJI ORIGIN SYSTEM
    // ========================================
    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function getVisibleHandFeeds(w, h) {
      return getVisibleFaceFeeds(w, h);
    }

    function detectHandsForFeed(feed) {
      if (!feed.video.videoWidth || !handLandmarker) return null;
      const currentTime = feed.video.currentTime;
      if (feed.id === "A" && lastHandVideoTimeA === currentTime) return handResultsA;
      if (feed.id === "B" && lastHandVideoTimeB === currentTime) return handResultsB;
      if (frame % 5 !== 0) return feed.id === "A" ? handResultsA : handResultsB;

      const result = handLandmarker.detectForVideo(feed.video, performance.now());
      if (feed.id === "A") {
        handResultsA = result;
        lastHandVideoTimeA = currentTime;
      } else {
        handResultsB = result;
        lastHandVideoTimeB = currentTime;
      }
      return result;
    }

    function mapHandPointToCanvas(landmark, feed) {
      const mirrorOn = activeFx.has("mirror");
      const x = mirrorOn ? 1 - landmark.x : landmark.x;
      return mapVideoPointToCanvas(x, landmark.y, feed.video, feed.rect);
    }

    function getHandCenter(landmarks, feed) {
      const points = [0, 5, 9, 17].map(index => mapHandPointToCanvas(landmarks[index], feed));
      return {
        x: points.reduce((sum, point) => sum + point.x, 0) / points.length,
        y: points.reduce((sum, point) => sum + point.y, 0) / points.length
      };
    }

    function getHandScale(landmarks, feed) {
      const wrist = mapHandPointToCanvas(landmarks[0], feed);
      const middleBase = mapHandPointToCanvas(landmarks[9], feed);
      const middleTip = mapHandPointToCanvas(landmarks[12], feed);
      return Math.max(
        Math.hypot(wrist.x - middleBase.x, wrist.y - middleBase.y),
        Math.hypot(wrist.x - middleTip.x, wrist.y - middleTip.y) * 0.55
      );
    }

    function getHandednessLabel(result, index) {
      const category = result
        && result.handedness
        && result.handedness[index]
        && result.handedness[index][0];
      return category && category.categoryName ? category.categoryName : `hand${index}`;
    }

    function findNearestHandTrack(detection, usedTrackIds) {
      let best = null;
      let bestDist = Infinity;
      for (const track of handTracks.values()) {
        if (usedTrackIds.has(track.id) || track.cameraId !== detection.cameraId) continue;
        const distToTrack = Math.hypot(track.x - detection.center.x, track.y - detection.center.y);
        const maxDist = Math.max(80, detection.scale * 1.35, track.scale * 1.35);
        if (distToTrack < maxDist && distToTrack < bestDist) {
          best = track;
          bestDist = distToTrack;
        }
      }
      return best;
    }

    function updateHandTracks(handResults, cameraId, now) {
      const usedTrackIds = new Set();
      handResults.forEach(detection => {
        const track = findNearestHandTrack(detection, usedTrackIds) || {
          id: nextHandTrackId++,
          currentGesture: "",
          stableFrames: 0,
          lastTriggeredAt: 0
        };

        if (!handTracks.has(track.id)) {
          track.x = detection.center.x;
          track.y = detection.center.y;
          track.scale = detection.scale;
          track.originX = detection.center.x;
          track.originY = detection.center.y;
          handTracks.set(track.id, track);
        } else {
          track.x += (detection.center.x - track.x) * HAND_TRACK_POSITION_SMOOTHING;
          track.y += (detection.center.y - track.y) * HAND_TRACK_POSITION_SMOOTHING;
          track.scale += (detection.scale - track.scale) * 0.25;
        }

        track.cameraId = cameraId || detection.cameraId;
        track.handedness = detection.handedness;
        track.landmarks = detection.landmarks;
        track.feed = detection.feed;
        track.lastSeenAt = now;
        usedTrackIds.add(track.id);
      });

      for (const [id, track] of handTracks.entries()) {
        if (now - track.lastSeenAt > HAND_LOST_GRACE_PERIOD) handTracks.delete(id);
      }
    }

    function recognizeGestureForHand(handTrack) {
      return handTrack && handTrack.landmarks ? detectGesture(handTrack.landmarks) : "";
    }

    function getGestureOrigin(gestureName, landmarks, feed, pairedHand = null) {
      if (gestureName === "HEART" && pairedHand) {
        const a = getHandCenter(landmarks, feed);
        const b = getHandCenter(pairedHand.landmarks, pairedHand.feed);
        return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      }

      if (gestureName === "GOOD") {
        return mapHandPointToCanvas(landmarks[4], feed);
      }

      if (gestureName === "PEACE") {
        const indexTip = mapHandPointToCanvas(landmarks[8], feed);
        const middleTip = mapHandPointToCanvas(landmarks[12], feed);
        return { x: (indexTip.x + middleTip.x) / 2, y: (indexTip.y + middleTip.y) / 2 };
      }

      if (gestureName === "OK") {
        const thumbTip = mapHandPointToCanvas(landmarks[4], feed);
        const indexTip = mapHandPointToCanvas(landmarks[8], feed);
        return { x: (thumbTip.x + indexTip.x) / 2, y: (thumbTip.y + indexTip.y) / 2 };
      }

      return getHandCenter(landmarks, feed);
    }

    function canTriggerGestureEmoji(handTrack, gestureName, now) {
      if (!gestureName) {
        handTrack.currentGesture = "";
        handTrack.candidateGesture = "";
        handTrack.gestureStartTime = 0;
        handTrack.gestureSent = false;
        return false;
      }

      if (handTrack.candidateGesture !== gestureName) {
        handTrack.currentGesture = gestureName;
        handTrack.candidateGesture = gestureName;
        handTrack.gestureStartTime = now;
        handTrack.gestureSent = false;
        return false;
      }

      handTrack.currentGesture = gestureName;
      if (!handTrack.gestureStartTime) handTrack.gestureStartTime = now;
      if (handTrack.gestureSent) return false;
      if (now - handTrack.gestureStartTime < GESTURE_EMOJI_HOLD_DURATION_MS) return false;

      handTrack.gestureSent = true;
      return true;
    }

    function spawnGestureEmoji(emoji, x, y, handScale, now) {
      const startSize = clamp(handScale * 0.9, 32, 72);
      gestureReactionEmojis.push({
        emoji,
        startX: x,
        startY: y,
        startTime: now,
        duration: GESTURE_EMOJI_DURATION,
        velocityX: randomRange(-30, 30),
        riseDistance: randomRange(120, GESTURE_EMOJI_RISE_DISTANCE + 20),
        rotation: randomRange(-0.25, 0.25),
        rotationSpeed: randomRange(-0.8, 0.8),
        startSize,
        endSize: clamp(startSize * randomRange(1.65, 2.05), 78, 112)
      });
      while (gestureReactionEmojis.length > MAX_GESTURE_EMOJIS) gestureReactionEmojis.shift();
    }

    function updateGestureEmojis(now) {
      gestureReactionEmojis = gestureReactionEmojis.filter(item => now - item.startTime < item.duration);
    }

    function drawGestureEmojis(targetCtx, now) {
      updateGestureEmojis(now);
      targetCtx.save();
      targetCtx.textAlign = "center";
      targetCtx.textBaseline = "middle";
      gestureReactionEmojis.forEach(item => {
        const progress = clamp((now - item.startTime) / item.duration, 0, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const x = item.startX + item.velocityX * progress;
        const y = item.startY - item.riseDistance * eased;
        const size = item.startSize + (item.endSize - item.startSize) * eased;
        const alpha = 1 - Math.pow(progress, 2);
        targetCtx.save();
        targetCtx.globalAlpha = alpha;
        targetCtx.translate(x, y);
        targetCtx.rotate(item.rotation + item.rotationSpeed * progress);
        targetCtx.font = `${size}px ${GESTURE_EMOJI_FONT}`;
        targetCtx.fillText(item.emoji, 0, 0);
        targetCtx.restore();
      });
      targetCtx.restore();
    }

    function clearGestureHandStates() {
      handTracks.clear();
      handResultsA = null;
      handResultsB = null;
      lastHandVideoTimeA = -1;
      lastHandVideoTimeB = -1;
    }

    function isTwoHandHeart(leftTrack, rightTrack) {
      if (!leftTrack || !rightTrack || !leftTrack.landmarks || !rightTrack.landmarks) return false;
      const a = leftTrack.landmarks;
      const b = rightTrack.landmarks;
      const aPalm = dist(a[0], a[9]);
      const bPalm = dist(b[0], b[9]);
      const scale = (aPalm + bPalm) / 2;
      if (!scale) return false;
      const indexClose = dist(a[8], b[8]) < scale * 0.5;
      const thumbClose = dist(a[4], b[4]) < scale * 0.58;
      const wristsApart = dist(a[0], b[0]) > scale * 0.85;
      const handsLevel = Math.abs(a[8].y - b[8].y) < scale * 0.42;
      return indexClose && thumbClose && wristsApart && handsLevel;
    }

    function triggerTwoHandHeartIfReady(now) {
      const tracks = [...handTracks.values()].filter(track => now - track.lastSeenAt <= HAND_LOST_GRACE_PERIOD);
      if (tracks.length < 2) return false;
      for (let i = 0; i < tracks.length - 1; i++) {
        for (let j = i + 1; j < tracks.length; j++) {
          const a = tracks[i];
          const b = tracks[j];
          if (a.cameraId !== b.cameraId) continue;
          if (!isTwoHandHeart(a, b)) continue;
          const heartId = `heart:${Math.min(a.id, b.id)}:${Math.max(a.id, b.id)}`;
          const heartState = handTracks.get(heartId) || {
            id: heartId,
            currentGesture: "",
            stableFrames: 0,
            lastTriggeredAt: 0,
            lastSeenAt: now
          };
          heartState.lastSeenAt = now;
          handTracks.set(heartId, heartState);
          if (canTriggerGestureEmoji(heartState, "HEART", now)) {
            const origin = getGestureOrigin("HEART", a.landmarks, a.feed, b);
            const scale = Math.max(a.scale, b.scale);
            spawnGestureEmoji(GESTURE_EMOJI_MAP.HEART, origin.x, origin.y, scale, now);
            heartState.lastTriggeredAt = now;
          }
          return true;
        }
      }
      return false;
    }

    function processGestureTracks(now) {
      const heartTriggered = triggerTwoHandHeartIfReady(now);
      for (const track of handTracks.values()) {
        if (typeof track.id === "string" || now - track.lastSeenAt > HAND_LOST_GRACE_PERIOD) continue;
        const gesture = recognizeGestureForHand(track);
        if (!gesture || (heartTriggered && gesture === "HEART")) {
          canTriggerGestureEmoji(track, "", now);
          continue;
        }
        if (!GESTURE_EMOJI_MAP[gesture]) continue;
        if (!canTriggerGestureEmoji(track, gesture, now)) continue;
        const origin = getGestureOrigin(gesture, track.landmarks, track.feed);
        spawnGestureEmoji(GESTURE_EMOJI_MAP[gesture], origin.x, origin.y, track.scale, now);
        track.lastTriggeredAt = now;
        gestureStatus.textContent = "Gesture: " + gesture;
      }
    }

    function updateGestureHandSystem(w, h, now) {
      if (!gestureEnabled) {
        gestureStatus.textContent = "Hand: OFF";
        return;
      }

      if (!handLandmarker) return;
      const detections = [];
      getVisibleHandFeeds(w, h).forEach(feed => {
        const result = detectHandsForFeed(feed);
        const hands = result && result.landmarks ? result.landmarks : [];
        hands.forEach((landmarks, index) => {
          const center = getHandCenter(landmarks, feed);
          detections.push({
            cameraId: feed.id,
            handedness: getHandednessLabel(result, index),
            landmarks,
            feed,
            center,
            scale: getHandScale(landmarks, feed)
          });
        });
      });

      if (!detections.length) {
        gestureStatus.textContent = "Hand: ON";
      }
      updateHandTracks(detections, "", now);
      processGestureTracks(now);

      if (DEBUG_GESTURE_EMOJI) {
        ctx.save();
        ctx.font = "12px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        for (const track of handTracks.values()) {
          if (typeof track.id === "string") continue;
          ctx.fillStyle = "rgba(255,240,80,0.9)";
          ctx.fillRect(track.x - 3, track.y - 3, 6, 6);
          ctx.fillText(`#${track.id} ${track.currentGesture || ""} ${track.stableFrames || 0}`, track.x + 8, track.y + 8);
        }
        ctx.restore();
      }
    }


    function defaultTextLayer(index = 1) {
      return {
        ...TEXT_DEFAULTS,
        positionPreset: index === 1 ? "top-center" : index === 2 ? "center" : "bottom-center",
        yPercent: index === 1 ? 12 : index === 2 ? 50 : 82,
        zIndex: index,
        animations: { ...TEXT_DEFAULTS.animations }
      };
    }

    function safeNumber(value, fallback, min = -Infinity, max = Infinity) {
      const n = Number(value);
      return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
    }

    function sanitizeTextLayer(layer, index) {
      const base = defaultTextLayer(index);
      const next = { ...base, ...(layer || {}) };
      next.text = typeof next.text === "string" ? next.text.slice(0, 2000) : "";
      next.visible = !!next.visible;
      next.playing = next.playing !== false;
      next.fontSize = safeNumber(next.fontSize, base.fontSize, 20, 300);
      next.opacity = safeNumber(next.opacity, base.opacity, 0, 1);
      next.xPercent = safeNumber(next.xPercent, base.xPercent, 0, 100);
      next.yPercent = safeNumber(next.yPercent, base.yPercent, 0, 100);
      next.speed = safeNumber(next.speed, base.speed, 0, 20);
      next.strokeWidth = safeNumber(next.strokeWidth, base.strokeWidth, 0, 20);
      next.shadowBlur = safeNumber(next.shadowBlur, base.shadowBlur, 0, 80);
      next.shadowOffsetX = safeNumber(next.shadowOffsetX, base.shadowOffsetX, -200, 200);
      next.shadowOffsetY = safeNumber(next.shadowOffsetY, base.shadowOffsetY, -200, 200);
      next.backgroundOpacity = safeNumber(next.backgroundOpacity, base.backgroundOpacity, 0, 1);
      next.backgroundPadding = safeNumber(next.backgroundPadding, base.backgroundPadding, 0, 120);
      next.backgroundRadius = safeNumber(next.backgroundRadius, base.backgroundRadius, 0, 120);
      next.marginTop = safeNumber(next.marginTop, base.marginTop, 0, 500);
      next.marginBottom = safeNumber(next.marginBottom, base.marginBottom, 0, 500);
      next.marginLeft = safeNumber(next.marginLeft, base.marginLeft, 0, 500);
      next.marginRight = safeNumber(next.marginRight, base.marginRight, 0, 500);
      next.animationSpeed = safeNumber(next.animationSpeed, base.animationSpeed, 0, 10);
      next.animationIntensity = safeNumber(next.animationIntensity, base.animationIntensity, 0, 10);
      next.zIndex = safeNumber(next.zIndex, base.zIndex, 1, 99);
      next.animations = { ...base.animations, ...((layer || {}).animations || {}) };
      return next;
    }

    function ensureTextLayerElement(layerId) {
      if (textLayerEls.has(layerId)) return textLayerEls.get(layerId);
      const el = document.createElement("div");
      el.className = "textLayer";
      textOverlay.appendChild(el);
      textLayerEls.set(layerId, el);
      return el;
    }

    function rgbaFromHex(hex, alpha) {
      const clean = /^#[0-9a-fA-F]{6}$/.test(hex || "") ? hex.slice(1) : "000000";
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function getPresetPosition(layer, w, h) {
      const preset = layer.positionPreset || "top-center";
      if (preset === "custom") return { x: w * layer.xPercent / 100, y: h * layer.yPercent / 100 };
      const left = layer.marginLeft;
      const right = w - layer.marginRight;
      const top = layer.marginTop;
      const bottom = h - layer.marginBottom;
      const cx = w * 0.5;
      const cy = h * 0.5;
      const map = {
        "top-left": { x: left, y: top },
        "top-center": { x: cx, y: top },
        "top-right": { x: right, y: top },
        "middle-left": { x: left, y: cy },
        "center": { x: cx, y: cy },
        "middle-right": { x: right, y: cy },
        "bottom-left": { x: left, y: bottom },
        "bottom-center": { x: cx, y: bottom },
        "bottom-right": { x: right, y: bottom }
      };
      return map[preset] || map["top-center"];
    }

    function resetTextLayerRuntime(layerId, layer, el, w, h) {
      const rect = el.getBoundingClientRect();
      const base = getPresetPosition(layer, w, h);
      const runtime = textLayerRuntime.get(layerId) || {};
      runtime.directionSign = 1;
      runtime.done = false;
      runtime.lastText = layer.text;
      runtime.lastDirection = layer.direction;
      runtime.lastResetToken = layer.resetToken;
      runtime.lastVisible = layer.visible;
      if (layer.direction === "left") runtime.x = w + rect.width / 2;
      else if (layer.direction === "right") runtime.x = -rect.width / 2;
      else runtime.x = base.x;
      if (layer.direction === "down") runtime.y = -rect.height / 2;
      else if (layer.direction === "up") runtime.y = h + rect.height / 2;
      else runtime.y = base.y;
      runtime.startedAt = performance.now();
      textLayerRuntime.set(layerId, runtime);
      return runtime;
    }

    function updateMovingText(layerId, layer, el, dt, w, h) {
      let runtime = textLayerRuntime.get(layerId);
      const needsReset = !runtime
        || runtime.lastText !== layer.text
        || runtime.lastDirection !== layer.direction
        || runtime.lastResetToken !== layer.resetToken
        || runtime.lastVisible !== layer.visible;
      if (needsReset) runtime = resetTextLayerRuntime(layerId, layer, el, w, h);
      const rect = el.getBoundingClientRect();
      const base = getPresetPosition(layer, w, h);
      if (layer.direction === "fixed" || layer.speed <= 0) {
        runtime.x = base.x;
        runtime.y = base.y;
        return runtime;
      }
      if (!layer.playing || runtime.done) return runtime;
      const velocity = layer.speed * 60 * dt * runtime.directionSign;
      if (layer.direction === "left") runtime.x -= velocity;
      if (layer.direction === "right") runtime.x += velocity;
      if (layer.direction === "down") runtime.y += velocity;
      if (layer.direction === "up") runtime.y -= velocity;
      const outLeft = runtime.x < -rect.width / 2;
      const outRight = runtime.x > w + rect.width / 2;
      const outTop = runtime.y < -rect.height / 2;
      const outBottom = runtime.y > h + rect.height / 2;
      const isOut = outLeft || outRight || outTop || outBottom;
      if (isOut && layer.loopMode === "loop") resetTextLayerRuntime(layerId, layer, el, w, h);
      if (isOut && layer.loopMode === "once") runtime.done = true;
      if (isOut && layer.loopMode === "bounce") runtime.directionSign *= -1;
      return runtime;
    }

    function applyTextLayerStyle(el, layer, now) {
      el.textContent = layer.text;
      el.style.fontFamily = layer.fontFamily || TEXT_DEFAULTS.fontFamily;
      el.style.fontSize = `${layer.fontSize}px`;
      el.style.fontWeight = layer.fontWeight;
      el.style.fontStyle = layer.fontStyle;
      el.style.textDecoration = layer.textDecoration;
      el.style.textAlign = layer.textAlign;
      el.style.color = layer.color;
      el.style.opacity = String(layer.opacity);
      el.style.zIndex = String(layer.zIndex);
      el.style.padding = layer.backgroundEnabled ? `${layer.backgroundPadding}px` : "0";
      el.style.borderRadius = layer.backgroundEnabled ? `${layer.backgroundRadius}px` : "0";
      el.style.background = layer.backgroundEnabled ? rgbaFromHex(layer.backgroundColor, layer.backgroundOpacity) : "transparent";
      el.style.webkitTextStroke = layer.strokeEnabled ? `${layer.strokeWidth}px ${layer.strokeColor}` : "0 transparent";
      el.style.textShadow = layer.shadowEnabled ? `${layer.shadowOffsetX}px ${layer.shadowOffsetY}px ${layer.shadowBlur}px ${layer.shadowColor}` : "none";
      if (layer.animations.rainbow) {
        const hue = (now * 0.04 * Math.max(0.1, layer.animationSpeed)) % 360;
        el.style.color = `hsl(${hue}, 100%, 62%)`;
      }
    }

    function updateTextOverlay(now) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dt = Math.min(0.08, Math.max(0, (now - lastTextOverlayTime) / 1000));
      lastTextOverlayTime = now;
      TEXT_LAYER_IDS.forEach((layerId, index) => {
        const layer = sanitizeTextLayer(textOverlayLayers[layerId], index + 1);
        const el = ensureTextLayerElement(layerId);
        if (!layer.visible || !layer.text.trim()) {
          el.style.display = "none";
          return;
        }
        el.style.display = "inline-block";
        applyTextLayerStyle(el, layer, now);
        const runtime = updateMovingText(layerId, layer, el, dt, w, h);
        let x = runtime.x;
        let y = runtime.y;
        let scale = 1;
        let rotate = 0;
        let alpha = layer.opacity;
        const phase = now * 0.001 * Math.max(0.1, layer.animationSpeed);
        const intensity = layer.animationIntensity;
        if (layer.animations.blink) alpha *= Math.sin(phase * Math.PI * 2) > 0 ? 1 : 0.18;
        if (layer.animations.fade) alpha *= 0.45 + 0.55 * (0.5 + Math.sin(phase * Math.PI * 2) * 0.5);
        if (layer.animations.pulse) scale += Math.sin(phase * Math.PI * 2) * 0.045 * intensity;
        if (layer.animations.shakeX) x += Math.sin(phase * 16) * 4 * intensity;
        if (layer.animations.shakeY) y += Math.cos(phase * 15) * 4 * intensity;
        if (layer.animations.rotate) rotate += Math.sin(phase * Math.PI * 2) * 0.04 * intensity;
        if (layer.animations.glitch) {
          x += (Math.random() - 0.5) * 8 * intensity;
          el.style.filter = `hue-rotate(${Math.sin(phase * 22) * 18}deg)`;
        } else {
          el.style.filter = "none";
        }
        el.style.opacity = String(Math.max(0, Math.min(1, alpha)));
        el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${rotate}rad) scale(${scale})`;
      });
    }
    // Avatar System ---------------------------------------------------------
    const POSE_LINES = [
      [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
      [11, 23], [12, 24], [23, 24], [23, 25], [25, 27],
      [24, 26], [26, 28], [27, 31], [28, 32]
    ];

    function setAvatarBufferSize(buffer, bufferCtx, w, h) {
      if (buffer.width !== w || buffer.height !== h) {
        buffer.width = w;
        buffer.height = h;
      }
      bufferCtx.setTransform(1, 0, 0, 1, 0, 0);
      bufferCtx.clearRect(0, 0, w, h);
    }

    function getVideoCoverRect(video, w, h) {
      if (!video.videoWidth || !video.videoHeight) return null;
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.max(w / vw, h / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      return { x: (w - dw) / 2, y: (h - dh) / 2, w: dw, h: dh };
    }

    function drawVideoCoverTo(targetCtx, video, x, y, w, h) {
      if (!video.videoWidth || !video.videoHeight) return;
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.max(w / vw, h / vh);
      const sw = w / scale;
      const sh = h / scale;
      const sx = (vw - sw) / 2;
      const sy = (vh - sh) / 2;
      targetCtx.drawImage(video, sx, sy, sw, sh, x, y, w, h);
    }

    function updateAvatarTracking(video) {
      if (!video.videoWidth || !poseLandmarker || !selfieSegmenter) return;
      if (lastAvatarVideoTime === video.currentTime) return;
      lastAvatarVideoTime = video.currentTime;

      const now = performance.now();
      poseResults = poseLandmarker.detectForVideo(video, now);
      if (frame % 3 === 0 || !segmentationResults) {
        segmentationResults = selfieSegmenter.segmentForVideo(video, now);
      }
    }

    function getPoseLandmarks() {
      if (!poseResults || !poseResults.landmarks || !poseResults.landmarks.length) return null;
      return poseResults.landmarks[0];
    }

    function mapPosePoint(point, w, h) {
      return { x: point.x * w, y: point.y * h };
    }

    function getMaskArray(mask) {
      if (!mask) return null;
      if (typeof mask.getAsUint8Array === "function") return mask.getAsUint8Array();
      if (typeof mask.getAsFloat32Array === "function") return mask.getAsFloat32Array();
      return null;
    }

    function buildBodyMask(w, h) {
      setAvatarBufferSize(avatarMaskBuffer, avatarMaskCtx, w, h);
      const categoryMask = segmentationResults && segmentationResults.categoryMask;
      const data = getMaskArray(categoryMask);
      const mw = categoryMask && categoryMask.width;
      const mh = categoryMask && categoryMask.height;
      const rect = getVideoCoverRect(videoA, w, h);
      if (!data || !mw || !mh || !rect) return false;

      const img = avatarMaskCtx.createImageData(mw, mh);
      for (let i = 0; i < data.length; i++) {
        const value = data[i];
        const body = value > 0.5;
        const a = body ? 255 : 0;
        const p = i * 4;
        img.data[p] = 255;
        img.data[p + 1] = 255;
        img.data[p + 2] = 255;
        img.data[p + 3] = a;
      }

      avatarFxBuffer.width = mw;
      avatarFxBuffer.height = mh;
      avatarFxCtx.putImageData(img, 0, 0);
      avatarMaskCtx.imageSmoothingEnabled = true;
      avatarMaskCtx.drawImage(avatarFxBuffer, rect.x, rect.y, rect.w, rect.h);
      return true;
    }

    function buildMaskedBody(w, h) {
      if (!buildBodyMask(w, h)) return false;
      setAvatarBufferSize(avatarBodyBuffer, avatarBodyCtx, w, h);
      drawVideoCoverTo(avatarBodyCtx, videoA, 0, 0, w, h);
      avatarBodyCtx.globalCompositeOperation = "destination-in";
      avatarBodyCtx.drawImage(avatarMaskBuffer, 0, 0, w, h);
      avatarBodyCtx.globalCompositeOperation = "source-over";
      return true;
    }

    function drawAvatar(w, h) {
      if (avatarMode === "off") return;
      if (!videoA.videoWidth) return;
      updateAvatarTracking(videoA);

      if (avatarMode === "mesh") drawMeshAvatar(w, h);
      if (avatarMode === "metallic") drawMetalAvatar(w, h);
      if (avatarMode === "beer") drawBeerAvatar(w, h);
      if (avatarMode === "dot") drawDotAvatar(w, h);
      if (avatarMode === "hologram") drawHologramAvatar(w, h);
      if (avatarMode === "aura") drawAuraAvatar(w, h);
    }

    function drawMeshAvatar(w, h) {
      const lm = getPoseLandmarks();
      if (!lm) return;

      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.lineWidth = 2;
      ctx.shadowBlur = 18;
      ctx.shadowColor = "rgba(0,255,220,0.95)";
      ctx.strokeStyle = "rgba(0,255,220,0.85)";

      POSE_LINES.forEach(([a, b]) => {
        const p1 = mapPosePoint(lm[a], w, h);
        const p2 = mapPosePoint(lm[b], w, h);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      });

      const shoulders = [mapPosePoint(lm[11], w, h), mapPosePoint(lm[12], w, h)];
      const hips = [mapPosePoint(lm[23], w, h), mapPosePoint(lm[24], w, h)];
      for (let i = 0; i <= 9; i++) {
        const a = i / 9;
        const leftX = shoulders[0].x * (1 - a) + hips[0].x * a;
        const leftY = shoulders[0].y * (1 - a) + hips[0].y * a;
        const rightX = shoulders[1].x * (1 - a) + hips[1].x * a;
        const rightY = shoulders[1].y * (1 - a) + hips[1].y * a;
        ctx.beginPath();
        ctx.moveTo(leftX, leftY);
        ctx.lineTo(rightX, rightY);
        ctx.stroke();
      }

      lm.forEach((p, i) => {
        if (i > 32) return;
        const pt = mapPosePoint(p, w, h);
        ctx.fillStyle = i % 2 ? "rgba(255,0,220,0.9)" : "rgba(0,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 3 + Math.sin(t * 3 + i) * 1.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawMetalAvatar(w, h) {
      if (!buildMaskedBody(w, h)) return;
      setAvatarBufferSize(avatarFxBuffer, avatarFxCtx, w, h);
      avatarFxCtx.drawImage(avatarBodyBuffer, 0, 0, w, h);
      avatarFxCtx.globalCompositeOperation = "source-atop";
      const grad = avatarFxCtx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "rgba(20,22,28,0.95)");
      grad.addColorStop(0.25, "rgba(250,252,255,0.98)");
      grad.addColorStop(0.45, "rgba(90,96,110,0.95)");
      grad.addColorStop(0.62, "rgba(255,255,255,0.98)");
      grad.addColorStop(1, "rgba(40,45,52,0.98)");
      avatarFxCtx.fillStyle = grad;
      avatarFxCtx.fillRect(0, 0, w, h);
      avatarFxCtx.globalAlpha = 0.65;
      avatarFxCtx.fillStyle = "rgba(170,220,255,0.55)";
      for (let x = -w; x < w * 1.4; x += 90) {
        const px = x + (t * 80) % 180;
        avatarFxCtx.fillRect(px, 0, 22, h);
      }
      avatarFxCtx.globalAlpha = 1;
      avatarFxCtx.globalCompositeOperation = "destination-in";
      avatarFxCtx.drawImage(avatarMaskBuffer, 0, 0, w, h);
      avatarFxCtx.globalCompositeOperation = "source-over";
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(avatarFxBuffer, 0, 0, w, h);
      ctx.shadowBlur = 28;
      ctx.shadowColor = "rgba(230,245,255,0.8)";
      ctx.drawImage(avatarMaskBuffer, 0, 0, w, h);
      ctx.restore();
    }

    function drawBeerAvatar(w, h) {
      if (!buildBodyMask(w, h)) return;
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(avatarMaskBuffer, 0, 0, w, h);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = "rgba(255,178,36,0.2)";
      ctx.fillRect(0, 0, w, h);
      const count = 95;
      for (let i = 0; i < count; i++) {
        const x = ((i * 83 + Math.sin(t + i) * 55) % w + w) % w;
        const y = ((i * 137 - t * (35 + (i % 7) * 8)) % h + h) % h;
        const r = 2 + (i % 9) * 0.8;
        ctx.fillStyle = i % 5 === 0 ? "rgba(255,248,210,0.88)" : "rgba(255,190,45,0.75)";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(255,204,64,0.9)";
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "destination-in";
      ctx.drawImage(avatarMaskBuffer, 0, 0, w, h);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(255,255,230,0.9)";
      for (let i = 0; i < 26; i++) {
        const x = (i * 151 + Math.sin(t * 1.7 + i) * 90) % w;
        const y = (h * 0.08 + i * 11 + Math.cos(t + i) * 18) % h;
        ctx.beginPath();
        ctx.arc(x, y, 3 + (i % 4), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawDotAvatar(w, h) {
      if (!buildMaskedBody(w, h)) return;
      const step = 12;
      const img = avatarBodyCtx.getImageData(0, 0, w, h).data;
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.shadowBlur = 10;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = ((Math.floor(y) * w) + Math.floor(x)) * 4;
          if (img[idx + 3] < 20) continue;
          const pulse = 0.65 + Math.sin(t * 4 + x * 0.03 + y * 0.02) * 0.35;
          ctx.fillStyle = `rgba(${img[idx]},${img[idx + 1]},${Math.min(255, img[idx + 2] + 90)},${0.55 + pulse * 0.35})`;
          ctx.shadowColor = "rgba(90,255,210,0.8)";
          ctx.beginPath();
          ctx.arc(x, y, 2.2 + pulse * 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawHologramAvatar(w, h) {
      if (!buildMaskedBody(w, h)) return;
      setAvatarBufferSize(avatarFxBuffer, avatarFxCtx, w, h);
      avatarFxCtx.globalAlpha = 0.45;
      avatarFxCtx.drawImage(avatarBodyBuffer, -4, 0, w, h);
      avatarFxCtx.globalCompositeOperation = "screen";
      avatarFxCtx.fillStyle = "rgba(0,80,255,0.45)";
      avatarFxCtx.fillRect(0, 0, w, h);
      avatarFxCtx.drawImage(avatarBodyBuffer, 4, 0, w, h);
      avatarFxCtx.fillStyle = "rgba(0,255,255,0.6)";
      for (let y = (t * 35) % 12; y < h; y += 12) {
        avatarFxCtx.fillRect(0, y, w, 2);
      }
      avatarFxCtx.globalCompositeOperation = "destination-in";
      avatarFxCtx.drawImage(avatarMaskBuffer, 0, 0, w, h);
      avatarFxCtx.globalCompositeOperation = "source-over";
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.shadowBlur = 24;
      ctx.shadowColor = "rgba(0,210,255,0.95)";
      ctx.drawImage(avatarFxBuffer, 0, 0, w, h);
      ctx.restore();
    }

    function drawAuraAvatar(w, h) {
      if (!buildBodyMask(w, h)) return;
      setAvatarBufferSize(avatarFxBuffer, avatarFxCtx, w, h);
      avatarFxCtx.drawImage(avatarMaskBuffer, 0, 0, w, h);
      avatarFxCtx.filter = "blur(22px)";
      for (let i = 0; i < 5; i++) {
        const dx = Math.sin(t * 1.4 + i) * (14 + i * 8);
        const dy = Math.cos(t * 1.2 + i) * (10 + i * 5);
        avatarFxCtx.globalAlpha = 0.22;
        avatarFxCtx.drawImage(avatarMaskBuffer, dx, dy, w, h);
      }
      avatarFxCtx.filter = "none";
      avatarFxCtx.globalCompositeOperation = "source-atop";
      const grad = avatarFxCtx.createRadialGradient(w * 0.5, h * 0.48, 10, w * 0.5, h * 0.5, Math.max(w, h) * 0.55);
      grad.addColorStop(0, "rgba(255,255,255,0.15)");
      grad.addColorStop(0.35, "rgba(0,255,190,0.55)");
      grad.addColorStop(0.7, "rgba(110,60,255,0.5)");
      grad.addColorStop(1, "rgba(0,170,255,0)");
      avatarFxCtx.fillStyle = grad;
      avatarFxCtx.fillRect(0, 0, w, h);
      avatarFxCtx.globalCompositeOperation = "source-over";
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.drawImage(avatarFxBuffer, 0, 0, w, h);
      ctx.strokeStyle = "rgba(170,255,235,0.35)";
      ctx.lineWidth = 2;
      for (let i = 0; i < 22; i++) {
        ctx.beginPath();
        const baseX = (i * 79 + t * 40) % w;
        for (let y = 0; y <= h; y += 28) {
          const x = baseX + Math.sin(y * 0.018 + t * 2 + i) * 38;
          if (y === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }


    function resetEightBitEffect() {
      eightBitFrozen = false;
      eightBitLastSpriteAt = 0;
      eightBitGhostFrames = [];
      eightBitLastSegTime = { A: -1, B: -1 };
      eightBitLastSegmentation = { A: null, B: null };
      if (eightBitFreezeBtn) eightBitFreezeBtn.classList.remove("active");
      [eightBitSourceCtx, eightBitMaskCtx, eightBitMaskedCtx, eightBitFullCtx, eightBitLivePersonCtx, eightBitSpriteCtx, eightBitOutlineCtx, eightBitPixelBgCtx, eightBitFrozenCtx].forEach(bufferCtx => {
        if (bufferCtx && bufferCtx.canvas) bufferCtx.clearRect(0, 0, bufferCtx.canvas.width, bufferCtx.canvas.height);
      });
    }

    function eightBitEnsureBuffer(canvasEl, bufferCtx, w, h) {
      const nextW = Math.max(1, Math.floor(w));
      const nextH = Math.max(1, Math.floor(h));
      if (canvasEl.width !== nextW || canvasEl.height !== nextH) {
        canvasEl.width = nextW;
        canvasEl.height = nextH;
      }
      bufferCtx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function eightBitEnsureMainBuffers(w, h) {
      [
        [eightBitSourceCanvas, eightBitSourceCtx],
        [eightBitMaskCanvas, eightBitMaskCtx],
        [eightBitMaskedCanvas, eightBitMaskedCtx],
        [eightBitSpriteCanvas, eightBitSpriteCtx],
        [eightBitOutlineCanvas, eightBitOutlineCtx],
        [eightBitPixelBgCanvas, eightBitPixelBgCtx]
      ].forEach(([canvasEl, bufferCtx]) => eightBitEnsureBuffer(canvasEl, bufferCtx, w, h));
    }

    function eightBitHexToRgb(hex) {
      const clean = String(hex || "#000000").replace("#", "");
      const full = clean.length === 3 ? clean.split("").map(ch => ch + ch).join("") : clean.padEnd(6, "0").slice(0, 6);
      const value = Number.parseInt(full, 16);
      return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
    }

    function eightBitGetPalette() {
      if (eightBitColorStyle === "gameboy") return ["#0f380f", "#306230", "#8bac0f", "#9bbc0f"].map(eightBitHexToRgb);
      if (eightBitColorStyle === "mono") return ["#101010", "#555555", "#aaaaaa", "#ffffff"].map(eightBitHexToRgb);
      if (eightBitColorStyle === "neon") return ["#050014", "#00f5ff", "#ff00d4", "#fcff00", "#00ff6a", "#7c4dff", "#ff3b30", "#ffffff"].map(eightBitHexToRgb);
      if (eightBitColorStyle === "custom") return eightBitCustomColorInputs.map(input => eightBitHexToRgb(input.value));
      if (eightBitColorStyle === "famicom") return ["#0f0f0f", "#f8f8f8", "#e43b44", "#f77622", "#feae34", "#fee761", "#63c74d", "#0099db", "#5b6ee1", "#905ea9", "#a46422", "#4d2b32"].map(eightBitHexToRgb);
      return null;
    }

    function eightBitNearestPaletteColor(r, g, b, palette) {
      let best = palette[0];
      let bestDistance = Infinity;
      for (const color of palette) {
        const dr = r - color.r;
        const dg = g - color.g;
        const db = b - color.b;
        const distance = dr * dr + dg * dg + db * db;
        if (distance < bestDistance) {
          bestDistance = distance;
          best = color;
        }
      }
      return best;
    }

    function eightBitQuantizeSmallCanvas(w, h) {
      if (eightBitColors === "original" && eightBitColorStyle === "original") return;
      const image = eightBitSmallCtx.getImageData(0, 0, w, h);
      const data = image.data;
      const palette = eightBitGetPalette();
      const count = eightBitColors === "original" ? 32 : Math.max(2, Number(eightBitColors) || 16);
      const channelLevels = Math.max(2, Math.round(Math.cbrt(count) + 1));
      const step = 255 / (channelLevels - 1);
      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3] < 8) continue;
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];
        if (palette) {
          const color = eightBitNearestPaletteColor(r, g, b, palette);
          r = color.r; g = color.g; b = color.b;
        } else {
          r = Math.round(Math.round(r / step) * step);
          g = Math.round(Math.round(g / step) * step);
          b = Math.round(Math.round(b / step) * step);
        }
        data[i] = r;
        data[i + 1] = g;
        data[i + 2] = b;
      }
      eightBitSmallCtx.putImageData(image, 0, 0);
    }

    function eightBitDrawCanvasCover(targetCtx, sourceCanvas, x, y, w, h) {
      const sw0 = sourceCanvas.width;
      const sh0 = sourceCanvas.height;
      if (!sw0 || !sh0 || w <= 0 || h <= 0) return;
      const scale = Math.max(w / sw0, h / sh0);
      const sw = w / scale;
      const sh = h / scale;
      const sx = (sw0 - sw) / 2;
      const sy = (sh0 - sh) / 2;
      targetCtx.drawImage(sourceCanvas, sx, sy, sw, sh, x, y, w, h);
    }

    function eightBitDrawMaskForFeed(feed, now) {
      const video = feed.video;
      const rect = feed.rect;
      if (!video || !video.videoWidth || !video.videoHeight || rect.w <= 0 || rect.h <= 0) return false;
      if (!selfieSegmenter) return false;
      try {
        if (eightBitLastSegTime[feed.id] !== video.currentTime || !eightBitLastSegmentation[feed.id]) {
          eightBitLastSegmentation[feed.id] = selfieSegmenter.segmentForVideo(video, now + (feed.id === "B" ? 0.5 : 0));
          eightBitLastSegTime[feed.id] = video.currentTime;
        }
        const categoryMask = eightBitLastSegmentation[feed.id] && eightBitLastSegmentation[feed.id].categoryMask;
        const data = getMaskArray(categoryMask);
        const mw = categoryMask && categoryMask.width;
        const mh = categoryMask && categoryMask.height;
        if (!data || !mw || !mh) return false;
        if (eightBitMaskSmallCanvas.width !== mw || eightBitMaskSmallCanvas.height !== mh) {
          eightBitMaskSmallCanvas.width = mw;
          eightBitMaskSmallCanvas.height = mh;
        }
        const image = eightBitMaskSmallCtx.createImageData(mw, mh);
        let maskMax = 0;
        for (let i = 0; i < data.length; i++) if (data[i] > maskMax) maskMax = data[i];
        const personThreshold = maskMax <= 1.5 ? 0.5 : 128;
        for (let i = 0; i < data.length; i++) {
          const value = data[i];
          const body = value < personThreshold;
          const p = i * 4;
          image.data[p] = 255;
          image.data[p + 1] = 255;
          image.data[p + 2] = 255;
          image.data[p + 3] = body ? 255 : 0;
        }
        eightBitMaskSmallCtx.putImageData(image, 0, 0);
        eightBitMaskCtx.imageSmoothingEnabled = true;
        eightBitDrawCanvasCover(eightBitMaskCtx, eightBitMaskSmallCanvas, rect.x, rect.y, rect.w, rect.h);
        return true;
      } catch (error) {
        console.warn("8-BIT segmentation unavailable:", error);
        return false;
      }
    }

    function eightBitBuildMask(w, h, now, fallbackFull = true) {
      eightBitMaskCtx.clearRect(0, 0, w, h);
      let feeds = getVisibleFaceFeeds(w, h).filter(feed => feed.video && feed.video.videoWidth && feed.video.videoHeight);
      if (eightBitPersonMode === "largest" && feeds.length > 1) {
        feeds = feeds.slice().sort((a, b) => (b.rect.w * b.rect.h) - (a.rect.w * a.rect.h)).slice(0, 1);
      }
      let drewMask = false;
      for (const feed of feeds) drewMask = eightBitDrawMaskForFeed(feed, now) || drewMask;
      if (!drewMask && fallbackFull) {
        eightBitMaskCtx.fillStyle = "#fff";
        eightBitMaskCtx.fillRect(0, 0, w, h);
      }
      return drewMask;
    }

    function eightBitGetLowResolution(w, h) {
      let lowW = Math.max(16, Math.floor(w / Math.max(2, eightBitPixelSize)));
      let lowH = Math.max(12, Math.floor(h / Math.max(2, eightBitPixelSize)));
      if (eightBitSpriteResolution !== "auto") {
        const sprite = Number(eightBitSpriteResolution) || 32;
        const targetW = Math.max(16, Math.floor(w * sprite / 320));
        if (targetW < lowW) {
          lowW = targetW;
          lowH = Math.max(12, Math.floor(lowW * h / w));
        }
      }
      return { lowW: Math.min(lowW, 360), lowH: Math.min(lowH, 240) };
    }

    function eightBitPixelateCanvas(sourceCanvas, targetCtx, w, h) {
      const { lowW, lowH } = eightBitGetLowResolution(w, h);
      if (eightBitSmallCanvas.width !== lowW || eightBitSmallCanvas.height !== lowH) {
        eightBitSmallCanvas.width = lowW;
        eightBitSmallCanvas.height = lowH;
      }
      eightBitSmallCtx.setTransform(1, 0, 0, 1, 0, 0);
      eightBitSmallCtx.clearRect(0, 0, lowW, lowH);
      eightBitSmallCtx.imageSmoothingEnabled = true;
      eightBitSmallCtx.drawImage(sourceCanvas, 0, 0, w, h, 0, 0, lowW, lowH);
      eightBitQuantizeSmallCanvas(lowW, lowH);
      targetCtx.clearRect(0, 0, w, h);
      targetCtx.imageSmoothingEnabled = false;
      targetCtx.drawImage(eightBitSmallCanvas, 0, 0, lowW, lowH, 0, 0, w, h);
      targetCtx.imageSmoothingEnabled = true;
    }

    function eightBitStoreGhostFrame(w, h, now) {
      if (!eightBitGhost || eightBitTarget === "off") return;
      const ghost = document.createElement("canvas");
      ghost.width = w;
      ghost.height = h;
      ghost.getContext("2d").drawImage(eightBitSpriteCanvas, 0, 0, w, h);
      eightBitGhostFrames.unshift({ canvas: ghost, time: now });
      const maxFrames = Math.max(eightBitGhostCount * 8, 8);
      while (eightBitGhostFrames.length > maxFrames) eightBitGhostFrames.pop();
    }

    function eightBitBuildPersonSprite(w, h) {
      eightBitMaskedCtx.clearRect(0, 0, w, h);
      eightBitMaskedCtx.drawImage(eightBitSourceCanvas, 0, 0, w, h);
      eightBitMaskedCtx.globalCompositeOperation = "destination-in";
      eightBitMaskedCtx.drawImage(eightBitMaskCanvas, 0, 0, w, h);
      eightBitMaskedCtx.globalCompositeOperation = "source-over";
      eightBitPixelateCanvas(eightBitMaskedCanvas, eightBitSpriteCtx, w, h);
      eightBitSpriteCtx.globalCompositeOperation = "destination-in";
      eightBitSpriteCtx.drawImage(eightBitMaskCanvas, 0, 0, w, h);
      eightBitSpriteCtx.globalCompositeOperation = "source-over";
    }

    function eightBitBuildBackgroundSprite(w, h) {
      eightBitPixelateCanvas(eightBitSourceCanvas, eightBitSpriteCtx, w, h);
    }

    function eightBitDrawLivePerson(w, h) {
      eightBitLivePersonCtx.clearRect(0, 0, w, h);
      eightBitLivePersonCtx.drawImage(eightBitSourceCanvas, 0, 0, w, h);
      eightBitLivePersonCtx.globalCompositeOperation = "destination-in";
      eightBitLivePersonCtx.drawImage(eightBitMaskCanvas, 0, 0, w, h);
      eightBitLivePersonCtx.globalCompositeOperation = "source-over";
      ctx.drawImage(eightBitLivePersonCanvas, 0, 0, w, h);
    }

    function eightBitBuildAllSprite(w, h) {
      eightBitPixelateCanvas(eightBitSourceCanvas, eightBitSpriteCtx, w, h);
    }

    function eightBitApplyPixelGrid(w, h, now) {
      if (!eightBitPixelGrid || eightBitTarget === "off") return;
      const grid = Math.max(2, eightBitPixelSize);
      const dx = Math.round(Math.sin(now * 0.004) * grid) * grid;
      const dy = Math.round(Math.cos(now * 0.003) * grid * 0.5) * grid;
      if (!dx && !dy) return;
      eightBitFullCtx.clearRect(0, 0, w, h);
      eightBitFullCtx.drawImage(eightBitSpriteCanvas, 0, 0, w, h);
      eightBitSpriteCtx.clearRect(0, 0, w, h);
      eightBitSpriteCtx.drawImage(eightBitFullCanvas, dx, dy, w, h);
      if (eightBitTarget === "person") {
        eightBitSpriteCtx.globalCompositeOperation = "destination-in";
        eightBitSpriteCtx.drawImage(eightBitMaskCanvas, dx, dy, w, h);
        eightBitSpriteCtx.globalCompositeOperation = "source-over";
      }
    }

    function eightBitBuildSprite(w, h, now) {
      eightBitSourceCtx.clearRect(0, 0, w, h);
      eightBitSourceCtx.drawImage(canvas, 0, 0, w, h);

      if (eightBitTarget === "off") return;

      const needsMask = eightBitTarget === "person" || eightBitTarget === "background" || (eightBitTarget === "all" && eightBitOutline);
      const hasSegmentation = needsMask ? eightBitBuildMask(w, h, now, eightBitTarget !== "all") : false;

      if (eightBitFrozen && eightBitFrozenCanvas.width && eightBitFrozenCanvas.height) {
        eightBitSpriteCtx.drawImage(eightBitFrozenCanvas, 0, 0, w, h);
        return;
      }
      const fps = eightBitFps === "live" ? 0 : Number(eightBitFps) || 12;
      const shouldHoldSprite = fps && now - eightBitLastSpriteAt < 1000 / fps && eightBitSpriteCanvas.width === w && eightBitSpriteCanvas.height === h;
      if (shouldHoldSprite) return;
      eightBitLastSpriteAt = now;
      eightBitSpriteCtx.clearRect(0, 0, w, h);

      if (eightBitTarget === "person") eightBitBuildPersonSprite(w, h);
      if (eightBitTarget === "background") eightBitBuildBackgroundSprite(w, h);
      if (eightBitTarget === "all") eightBitBuildAllSprite(w, h);
      eightBitApplyPixelGrid(w, h, now);

      if (!hasSegmentation && (eightBitTarget === "person" || eightBitTarget === "background")) {
        eightBitSpriteCtx.save();
        eightBitSpriteCtx.fillStyle = "rgba(0,0,0,0.5)";
        eightBitSpriteCtx.fillRect(16, h - 42, 318, 26);
        eightBitSpriteCtx.fillStyle = "#fff";
        eightBitSpriteCtx.font = "12px sans-serif";
        eightBitSpriteCtx.fillText("8-BIT Person Segmentation unavailable", 26, h - 25);
        eightBitSpriteCtx.restore();
      }
      eightBitStoreGhostFrame(w, h, now);
    }

    function eightBitDrawBackground(w, h) {
      if (eightBitTarget !== "person") return;
      if (eightBitBackground === "black" || eightBitBackground === "white" || eightBitBackground === "solid") {
        ctx.fillStyle = eightBitBackground === "black" ? "#000" : eightBitBackground === "white" ? "#fff" : eightBitBackgroundColor;
        ctx.fillRect(0, 0, w, h);
      }
      if (eightBitBackground === "pixel") {
        const pw = Math.max(24, Math.floor(w / Math.max(2, eightBitPixelSize * 0.55)));
        const ph = Math.max(18, Math.floor(h / Math.max(2, eightBitPixelSize * 0.55)));
        if (eightBitPixelBgCanvas.width !== pw || eightBitPixelBgCanvas.height !== ph) {
          eightBitPixelBgCanvas.width = pw;
          eightBitPixelBgCanvas.height = ph;
        }
        eightBitPixelBgCtx.imageSmoothingEnabled = true;
        eightBitPixelBgCtx.drawImage(eightBitSourceCanvas, 0, 0, w, h, 0, 0, pw, ph);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(eightBitPixelBgCanvas, 0, 0, pw, ph, 0, 0, w, h);
        ctx.imageSmoothingEnabled = true;
      }
    }

    function eightBitGetOutlineColor() {
      if (eightBitOutlineColorMode === "white") return "#ffffff";
      if (eightBitOutlineColorMode === "custom") return eightBitOutlineCustomColor;
      return "#000000";
    }

    function eightBitDrawOutline(w, h) {
      if (!eightBitOutline || eightBitTarget === "off") return;
      const step = Math.max(1, eightBitPixelSize * eightBitOutlineWidth);
      eightBitOutlineCtx.clearRect(0, 0, w, h);
      for (let ox = -step; ox <= step; ox += step) {
        for (let oy = -step; oy <= step; oy += step) {
          if (!ox && !oy) continue;
          eightBitOutlineCtx.drawImage(eightBitMaskCanvas, ox, oy, w, h);
        }
      }
      eightBitOutlineCtx.globalCompositeOperation = "destination-out";
      eightBitOutlineCtx.drawImage(eightBitMaskCanvas, 0, 0, w, h);
      eightBitOutlineCtx.globalCompositeOperation = "source-in";
      eightBitOutlineCtx.fillStyle = eightBitGetOutlineColor();
      eightBitOutlineCtx.fillRect(0, 0, w, h);
      eightBitOutlineCtx.globalCompositeOperation = "source-over";
      ctx.drawImage(eightBitOutlineCanvas, 0, 0, w, h);
    }

    function eightBitDrawGhostFrames(w, h, now) {
      if (!eightBitGhost || eightBitTarget === "off") return;
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      let drawn = 0;
      for (const ghost of eightBitGhostFrames) {
        const age = now - ghost.time;
        const slot = Math.floor(age / Math.max(50, eightBitGhostDelay));
        if (slot < 1 || slot > eightBitGhostCount) continue;
        ctx.globalAlpha = eightBitGhostOpacity * Math.pow(0.62, slot - 1);
        ctx.drawImage(ghost.canvas, 0, 0, w, h);
        drawn++;
        if (drawn >= eightBitGhostCount) break;
      }
      ctx.restore();
    }

    function drawEightBitEffect(w, h, now) {
      if (!activeFx.has("eightbit") || eightBitTarget === "off") return;
      eightBitEnsureMainBuffers(w, h);
      eightBitBuildSprite(w, h, now);
      if (eightBitTarget === "off") return;

      if (eightBitTarget === "person") {
        eightBitDrawBackground(w, h);
        eightBitDrawGhostFrames(w, h, now);
        ctx.save();
        ctx.globalAlpha = eightBitOpacity;
        eightBitDrawOutline(w, h);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(eightBitSpriteCanvas, 0, 0, w, h);
        ctx.restore();
        return;
      }

      if (eightBitTarget === "background") {
        eightBitDrawGhostFrames(w, h, now);
        ctx.save();
        ctx.globalAlpha = eightBitOpacity;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(eightBitSpriteCanvas, 0, 0, w, h);
        ctx.restore();
        eightBitDrawLivePerson(w, h);
        eightBitDrawOutline(w, h);
        return;
      }

      if (eightBitTarget === "all") {
        eightBitDrawGhostFrames(w, h, now);
        ctx.save();
        ctx.globalAlpha = eightBitOpacity;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(eightBitSpriteCanvas, 0, 0, w, h);
        ctx.restore();
        eightBitDrawOutline(w, h);
      }
    }

    function timeWarpStartProgress() {
      return (timeWarpDirection === "bottom-top" || timeWarpDirection === "right-left") ? 1 : 0;
    }

    function timeWarpEnsureBuffers(w, h) {
      if (timeWarpCanvas.width === w && timeWarpCanvas.height === h) return;
      [timeWarpCanvas, timeWarpSourceCanvas, timeWarpTrailCanvas].forEach(c => { c.width = w; c.height = h; });
      timeWarpCtx.clearRect(0, 0, w, h);
      timeWarpSourceCtx.clearRect(0, 0, w, h);
      timeWarpTrailCtx.clearRect(0, 0, w, h);
      timeWarpGhostBuffers = [];
      timeWarpLastProgress = timeWarpStartProgress();
      timeWarpRunning = activeFx.has("timewarp");
      timeWarpCompleted = false;
      timeWarpScanStart = performance.now();
    }

    function timeWarpGetScanTime() {
      if (!sync) return timeWarpScanTime;
      const fallbackBpm = 120;
      return (60 / fallbackBpm) * timeWarpSyncBeats;
    }

    function timeWarpStartScan() {
      timeWarpCtx.clearRect(0, 0, timeWarpCanvas.width, timeWarpCanvas.height);
      timeWarpRunning = true;
      timeWarpFrozen = false;
      timeWarpCompleted = false;
      timeWarpCompletedAt = 0;
      timeWarpLastProgress = timeWarpStartProgress();
      timeWarpScanStart = performance.now();
      timeWarpFreezeBtn.textContent = "FREEZE";
      timeWarpFreezeBtn.classList.remove("active");
    }

    function timeWarpReset(restart) {
      timeWarpCtx.clearRect(0, 0, timeWarpCanvas.width, timeWarpCanvas.height);
      timeWarpTrailCtx.clearRect(0, 0, timeWarpTrailCanvas.width, timeWarpTrailCanvas.height);
      timeWarpGhostBuffers = [];
      timeWarpRunning = !!restart;
      timeWarpFrozen = false;
      timeWarpCompleted = false;
      timeWarpCompletedAt = 0;
      timeWarpLastProgress = timeWarpStartProgress();
      timeWarpScanStart = performance.now();
      timeWarpFreezeBtn.textContent = "FREEZE";
      timeWarpFreezeBtn.classList.remove("active");
    }

    function timeWarpReverseDirection() {
      const next = {
        "top-bottom": "bottom-top",
        "bottom-top": "top-bottom",
        "left-right": "right-left",
        "right-left": "left-right"
      };
      timeWarpDirection = next[timeWarpDirection] || "top-bottom";
      timeWarpDirectionInput.value = timeWarpDirection;
    }

    function timeWarpStoreGhost(w, h) {
      if (!timeWarpMultiGhost) return;
      const ghost = document.createElement("canvas");
      ghost.width = w;
      ghost.height = h;
      ghost.getContext("2d").drawImage(timeWarpCanvas, 0, 0, w, h);
      timeWarpGhostBuffers.unshift(ghost);
      while (timeWarpGhostBuffers.length > timeWarpGhostCount) timeWarpGhostBuffers.pop();
    }

    function timeWarpCaptureSlice(w, h, progress) {
      const from = Math.max(0, Math.min(1, timeWarpLastProgress));
      const to = Math.max(0, Math.min(1, progress));
      const a = Math.min(from, to);
      const b = Math.max(from, to);
      const pad = Math.max(1, timeWarpBarThickness);
      if (timeWarpDirection === "top-bottom" || timeWarpDirection === "bottom-top") {
        const y0 = Math.max(0, Math.floor(a * h) - pad);
        const y1 = Math.min(h, Math.ceil(b * h) + pad);
        if (y1 > y0) timeWarpCtx.drawImage(timeWarpSourceCanvas, 0, y0, w, y1 - y0, 0, y0, w, y1 - y0);
      } else {
        const x0 = Math.max(0, Math.floor(a * w) - pad);
        const x1 = Math.min(w, Math.ceil(b * w) + pad);
        if (x1 > x0) timeWarpCtx.drawImage(timeWarpSourceCanvas, x0, 0, x1 - x0, h, x0, 0, x1 - x0, h);
      }
      timeWarpLastProgress = progress;
    }

    function timeWarpDrawLayer(w, h) {
      ctx.save();
      ctx.globalAlpha = timeWarpOpacity;
      ctx.globalCompositeOperation = timeWarpBlendMode;
      if (timeWarpMultiGhost) {
        timeWarpGhostBuffers.forEach((ghost, index) => {
          ctx.globalAlpha = timeWarpOpacity * Math.pow(0.58, index + 1);
          ctx.drawImage(ghost, 0, 0, w, h);
        });
      }
      if (timeWarpTrail) {
        ctx.globalAlpha = timeWarpOpacity * 0.75;
        ctx.drawImage(timeWarpTrailCanvas, 0, 0, w, h);
      }
      ctx.globalAlpha = timeWarpOpacity;
      ctx.drawImage(timeWarpCanvas, 0, 0, w, h);
      ctx.restore();
    }

    function timeWarpDrawScanBar(w, h, progress) {
      if (!timeWarpShowBar || timeWarpCompleted) return;
      ctx.save();
      ctx.strokeStyle = timeWarpBarColor;
      ctx.lineWidth = timeWarpBarThickness;
      ctx.shadowColor = timeWarpGlow ? timeWarpBarColor : "transparent";
      ctx.shadowBlur = timeWarpGlow ? 18 : 0;
      ctx.beginPath();
      if (timeWarpDirection === "top-bottom" || timeWarpDirection === "bottom-top") {
        const y = progress * h;
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
      } else {
        const x = progress * w;
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
      }
      ctx.stroke();
      ctx.restore();
    }

    function timeWarpRender(w, h, now) {
      if (!activeFx.has("timewarp")) return;
      timeWarpEnsureBuffers(w, h);
      timeWarpSourceCtx.setTransform(1, 0, 0, 1, 0, 0);
      timeWarpSourceCtx.clearRect(0, 0, w, h);
      timeWarpSourceCtx.drawImage(canvas, 0, 0, w, h);

      let progress = timeWarpLastProgress;
      if (timeWarpRunning && !timeWarpFrozen) {
        const scanMs = Math.max(0.5, timeWarpGetScanTime()) * 1000;
        progress = Math.min(1, (now - timeWarpScanStart) / scanMs);
        if (timeWarpDirection === "bottom-top" || timeWarpDirection === "right-left") progress = 1 - progress;
        timeWarpCaptureSlice(w, h, progress);
        const rawProgress = Math.min(1, (now - timeWarpScanStart) / scanMs);
        if (rawProgress >= 1 && !timeWarpCompleted) {
          timeWarpCompleted = true;
          timeWarpRunning = false;
          timeWarpCompletedAt = now;
          timeWarpStoreGhost(w, h);
        }
      }

      if (timeWarpTrail) {
        timeWarpTrailCtx.save();
        timeWarpTrailCtx.globalCompositeOperation = "destination-out";
        timeWarpTrailCtx.fillStyle = `rgba(0,0,0,${1 - timeWarpTrailDecay})`;
        timeWarpTrailCtx.fillRect(0, 0, w, h);
        timeWarpTrailCtx.globalCompositeOperation = "source-over";
        timeWarpTrailCtx.drawImage(timeWarpCanvas, 0, 0, w, h);
        timeWarpTrailCtx.restore();
      }

      if (timeWarpDisplayMode === "warp-only") {
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(timeWarpSourceCanvas, 0, 0, w, h);
      }
      timeWarpDrawLayer(w, h);
      timeWarpDrawScanBar(w, h, progress);

      if (timeWarpCompleted && timeWarpAfterScan === "auto-reset" && now - timeWarpCompletedAt > 1200) timeWarpReset(false);
      if (timeWarpCompleted && timeWarpAfterScan === "loop") {
        if (timeWarpPingPong) timeWarpReverseDirection();
        timeWarpStartScan();
      }
    }

    function applyFx(w, h) {
      if (activeFx.size === 0) return;

      if (activeFx.has("rgb")) {
        const shift = 5 + power * 35;
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.45;
        ctx.drawImage(canvas, shift, 0, w, h);
        ctx.drawImage(canvas, -shift, 0, w, h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }

      if (activeFx.has("mirror")) {
        ctx.save();
        ctx.globalAlpha = 0.35 + power * 0.5;
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(canvas, 0, 0, w, h);
        ctx.restore();
      }

      if (activeFx.has("wave")) {
        fxBuffer.width = w;
        fxBuffer.height = h;
        fxCtx.drawImage(canvas, 0, 0, w, h);
        const amp = 4 + power * 28;
        const freq = 0.012 + power * 0.018;
        for (let y = 0; y < h; y += 6) {
          const dx = Math.sin(y * freq + t) * amp;
          ctx.drawImage(fxBuffer, 0, y, w, 6, dx, y, w, 6);
        }
      }

      if (activeFx.has("glitch")) {
        const glitchInterval = Math.max(5, Math.floor(16 - power * 8));
        if (frame % glitchInterval === 0) {
          const count = 3 + Math.floor(power * 14);
          for (let i = 0; i < count; i++) {
            const y = Math.random() * h;
            const sh = 5 + Math.random() * 28;
            const dx = (Math.random() - 0.5) * power * 90;
            ctx.drawImage(canvas, 0, y, w, sh, dx, y, w, sh);
          }
        }
      }

      if (activeFx.has("mono") || activeFx.has("invert")) {
        const img = ctx.getImageData(0, 0, w, h);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];

          if (activeFx.has("mono")) {
            const gray = (r + g + b) / 3;
            d[i] = r * (1 - power) + gray * power;
            d[i + 1] = g * (1 - power) + gray * power;
            d[i + 2] = b * (1 - power) + gray * power;
          }

          if (activeFx.has("invert")) {
            d[i] = d[i] * (1 - power) + (255 - d[i]) * power;
            d[i + 1] = d[i + 1] * (1 - power) + (255 - d[i + 1]) * power;
            d[i + 2] = d[i + 2] * (1 - power) + (255 - d[i + 2]) * power;
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      if (activeFx.has("pixel")) {
        const scale = 0.04 + (1 - power) * 0.18;
        const sw = Math.max(24, Math.floor(w * scale));
        const sh = Math.max(18, Math.floor(h * scale));
        fxBuffer.width = sw;
        fxBuffer.height = sh;
        fxCtx.imageSmoothingEnabled = false;
        fxCtx.drawImage(canvas, 0, 0, sw, sh);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(fxBuffer, 0, 0, sw, sh, 0, 0, w, h);
        ctx.imageSmoothingEnabled = true;
      }

      if (activeFx.has("strobe")) {
        const flash = Math.sin(t * (1.5 + power * 5)) > 0.82;
        if (flash) {
          ctx.fillStyle = `rgba(255,255,255,${0.18 + power * 0.45})`;
          ctx.fillRect(0, 0, w, h);
        }
      }

      if (activeFx.has("zoom")) {
        const z = 1 + power * 0.08 + Math.sin(t * 1.5) * power * 0.025;
        fxBuffer.width = w;
        fxBuffer.height = h;
        fxCtx.drawImage(canvas, 0, 0, w, h);
        ctx.globalAlpha = 0.45 + power * 0.35;
        ctx.drawImage(fxBuffer, (w - w * z) / 2, (h - h * z) / 2, w * z, h * z);
        ctx.globalAlpha = 1;
      }
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function isExtended(lm, tip, pip) {
      return lm[tip].y < lm[pip].y;
    }

    function detectGesture(lm) {
      const thumbTip = lm[4];
      const indexTip = lm[8];
      const middleTip = lm[12];
      const ringTip = lm[16];
      const pinkyTip = lm[20];

      const indexExt = isExtended(lm, 8, 6);
      const middleExt = isExtended(lm, 12, 10);
      const ringExt = isExtended(lm, 16, 14);
      const pinkyExt = isExtended(lm, 20, 18);

      const okDist = dist(thumbTip, indexTip);
      const palmSize = dist(lm[0], lm[9]);

      if (okDist < palmSize * 0.38 && middleExt && ringExt && pinkyExt) return "OK";
      if (indexExt && middleExt && !ringExt && !pinkyExt && dist(indexTip, middleTip) > palmSize * 0.35) return "PEACE";
      if (thumbTip.y < lm[3].y && !indexExt && !middleExt && !ringExt && !pinkyExt) return "GOOD";
      if (indexExt && middleExt && dist(indexTip, middleTip) < palmSize * 0.35) return "HEART";

      return "";
    }

    function handleHands() {
      if (!gestureEnabled) {
        gestureStatus.textContent = "Hand: OFF";
        return;
      }

      if (!handLandmarker || !videoA.videoWidth) return;
      if (frame % 5 !== 0) return;

      const result = handLandmarker.detectForVideo(videoA, performance.now());
      if (!result.landmarks || result.landmarks.length === 0) {
        gestureStatus.textContent = "Hand: ON";
        return;
      }

      for (const lm of result.landmarks) {
        const gesture = detectGesture(lm);
        if (!gesture) continue;

        const now = performance.now();
        if (gesture === lastGesture && now - lastGestureTime < 1600) return;

        lastGesture = gesture;
        lastGestureTime = now;
        gestureStatus.textContent = "Gesture: " + gesture;

        if (gesture === "OK") burstEmoji("👌", 7);
        if (gesture === "PEACE") burstEmoji("✌️", 7);
        if (gesture === "HEART") burstEmoji("❤️", 9);
        if (gesture === "GOOD") burstEmoji("👍", 7);
      }
    }

    function loop() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      t += 0.05;
      frame++;

      drawBase(w, h);
      drawAvatar(w, h);
      applyFx(w, h);
      drawEightBitEffect(w, h, performance.now());
      timeWarpRender(w, h, performance.now());
      updateFaceMaskSystem(w, h, performance.now());
      drawFaceMasks(ctx, performance.now());
      updateGestureHandSystem(w, h, performance.now());
      drawGestureEmojis(ctx, performance.now());
      updateTextOverlay(performance.now());

      requestAnimationFrame(loop);
    }

    function spawnEmoji(char) {
      const el = document.createElement("div");
      el.className = "emoji";
      el.textContent = char;
      el.style.fontSize = 36 + Math.random() * 70 + "px";
      el.style.left = Math.random() * 92 + "vw";
      el.style.bottom = "-10vh";
      document.getElementById("screen").appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function burstEmoji(char, n) {
      for (let i = 0; i < n; i++) {
        setTimeout(() => spawnEmoji(char), i * 80);
      }
    }

    function normalizeReactionPayload(data, snapshotKey = "") {
      if (!data) return [];
      if (typeof data === "string") {
        return [{ value: data, type: "reaction", id: snapshotKey }];
      }
      if (Array.isArray(data)) {
        return data.map((item, index) => typeof item === "string"
          ? { value: item, type: "reaction", id: `${snapshotKey}:${index}` }
          : {
              value: typeof item.value === "string" ? item.value : typeof item.emoji === "string" ? item.emoji : "",
              type: item.type || "reaction",
              id: item.id || `${snapshotKey}:${index}`,
              timestamp: item.timestamp
            });
      }
      if (data.type === "textOverlay" && data.layers) {
        return [{ type: "textOverlay", layers: data.layers, id: data.id || snapshotKey, timestamp: data.timestamp }];
      }
      if (Array.isArray(data.items)) return normalizeReactionPayload(data.items, snapshotKey);
      if (Array.isArray(data.emojis)) {
        return data.emojis.map((emoji, index) => typeof emoji === "string"
          ? { value: emoji, type: "reaction", id: `${snapshotKey}:emoji:${index}` }
          : {
              value: typeof emoji.value === "string" ? emoji.value : typeof emoji.emoji === "string" ? emoji.emoji : "",
              type: emoji.type || "reaction",
              id: emoji.id || `${snapshotKey}:emoji:${index}`,
              timestamp: emoji.timestamp
            });
      }
      if (typeof data.value === "string" || typeof data.emoji === "string") {
        return [{
          value: typeof data.value === "string" ? data.value : data.emoji,
          type: data.type || "reaction",
          id: data.id || snapshotKey,
          timestamp: data.timestamp
        }];
      }
      return [];
    }


    onChildAdded(ref(db, "reactions"), snapshot => {
      const reactions = normalizeReactionPayload(snapshot.val(), snapshot.key);
      reactions.slice(0, 15).forEach((item, i) => {
        const type = item.type || "reaction";
        if (type === "textOverlay" && item.layers) {
          TEXT_LAYER_IDS.forEach((id, index) => {
            textOverlayLayers[id] = sanitizeTextLayer(item.layers[id], index + 1);
          });
          lastTextOverlayTime = performance.now();
          return;
        }
        if (type === "faceMask") {
          enqueueFaceMaskReaction(item, `${snapshot.key}:${i}`);
          return;
        }
        if (type === "reaction" && typeof item.value === "string" && item.value.length <= 16) {
          setTimeout(() => spawnEmoji(item.value), i * 70);
        }
      });
    });

    updateFxButtons();
    updateAvatarButtons();
    setFaceMaskEnabled(faceMaskEnabled);
    loop();
  </script>
</body>
</html>
