<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>MOSW VJ Screen</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    #screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #vjCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: #000;
    }

    video { display: none; }

    #message {
      position: absolute;
      top: 34px;
      left: 42px;
      z-index: 4;
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      pointer-events: none;
    }

    #gestureStatus {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      color: white;
      font-size: 12px;
      opacity: 0.75;
      background: rgba(0,0,0,0.35);
      padding: 7px 10px;
      border-radius: 10px;
    }

    #controls {
      position: fixed;
      left: 18px;
      bottom: 14px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(0,0,0,0.35);
      color: white;
      font-size: 12px;
      user-select: none;
          opacity: 1;
      pointer-events: auto;
      transition: opacity 0.45s ease;
    }

    #controls.ui-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select, input { font-size: 13px; }

    .controlLink {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 13px;
      border-radius: 9px;
      background: rgba(0,208,132,0.22);
      color: #9dffd0;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 9px 13px;
      background: #ddd;
      color: #111;
      cursor: pointer;
    }

    button.active {
      background: #00d084;
      color: #000;
      font-weight: 700;
    }

    select {
      height: 34px;
      border-radius: 8px;
      padding: 4px;
    }

    input[type="range"] { width: 120px; }

    input[type="color"] {
      width: 42px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
    }

    .time-warp-panel {
      display: none;
      max-width: 980px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.18);
    }

    .time-warp-panel.active { display: flex; }
    .eight-bit-panel { display: none; max-width: 980px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.18); }
    .eight-bit-panel.active { display: flex; }

    .mini-label {
      opacity: 0.9;
      font-size: 12px;
    }

    .emoji {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      animation: fly 2.8s ease-out forwards;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
    }


    #textOverlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      overflow: hidden;
    }

    .textLayer {
      position: absolute;
      left: 0;
      top: 0;
      white-space: pre-wrap;
      line-height: 1.08;
      will-change: transform, opacity, filter;
      transform-origin: center center;
      display: inline-block;
      max-width: 96vw;
      overflow-wrap: anywhere;
    }
    @keyframes fly {
      0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-65vh) scale(1.9) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

    function drawVideoCover(video, x, y, w, h) {
      if (!video.videoWidth || !video.videoHeight) return;
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const scale = Math.max(w / vw, h / vh);
      const sw = w / scale;
      const sh = h / scale;
      const sx = (vw - sw) / 2;
      const sy = (vh - sh) / 2;
      ctx.drawImage(video, sx, sy, sw, sh, x, y, w, h);
    }

    function drawBase(w, h) {
      ctx.fillStyle = sync ? "rgba(0,0,0,0.18)" : "#000";
      ctx.fillRect(0, 0, w, h);

      if (camMode === "A") drawVideoCover(videoA, 0, 0, w, h);
      if (camMode === "B") drawVideoCover(videoB, 0, 0, w, h);

      if (camMode === "split") {
        const leftW = w * split;
        drawVideoCover(videoA, 0, 0, leftW, h);
        drawVideoCover(videoB, leftW, 0, w - leftW, h);
        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.fillRect(leftW - 1, 0, 2, h);
      }

      if (camMode === "overlay") {
        drawVideoCover(videoA, 0, 0, w, h);
        ctx.globalAlpha = 0.25 + power * 0.6;
        drawVideoCover(videoB, 0, 0, w, h);
        ctx.globalAlpha = 1;
      }

      if (camMode === "pip") {
        drawVideoCover(videoA, 0, 0, w, h);
        const pw = w * 0.3;
        const ph = pw * 9 / 16;
        const m = 28;
        drawVideoCover(videoB, w - pw - m, h - ph - m, pw, ph);
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 3;
        ctx.strokeRect(w - pw - m, h - ph - m, pw, ph);
      }
    }

    function getVisibleFaceFeeds(w, h) {
      if (camMode === "A") return [{ video: videoA, id: "A", rect: { x: 0, y: 0, w, h } }];
      if (camMode === "B") return [{ video: videoB, id: "B", rect: { x: 0, y: 0, w, h } }];

      if (camMode === "split") {
        const leftW = w * split;
        return [
          { video: videoA, id: "A", rect: { x: 0, y: 0, w: leftW, h } },
          { video: videoB, id: "B", rect: { x: leftW, y: 0, w: w - leftW, h } }

      if (camMode === "overlay") {
        return [
